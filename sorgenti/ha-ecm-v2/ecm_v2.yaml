          # Trend zona su 20/30/60 minuti in una sola card
          - type: custom:button-card
            template: ecm_base
            entity: sensor.ecm_trend_zona_attiva_30m
            name: Trend zona
            icon: mdi:chart-line
            show_icon: true
            show_name: true
            show_state: false
            grid_options:
              columns: full
            triggers_update:
              - sensor.ecm_trend_zona_attiva_20m
              - sensor.ecm_trend_zona_attiva_30m
              - sensor.ecm_trend_zona_attiva_60m
            custom_fields:
              trend: |
                [[[
                  const cell = (e, l) => {
                    const v = parseFloat(states[e]?.state);
                    if (isNaN(v)) return `<div><div style="font-size:11px;color:var(--secondary-text-color)">${l}</div><div style="font-weight:600">—</div></div>`;
                    const c = v > 0.02 ? 'var(--error-color)' : (v < -0.02 ? 'var(--info-color)' : 'var(--secondary-text-color)');
                    const a = v > 0.02 ? '▲' : (v < -0.02 ? '▼' : '●');
                    return `<div><div style="font-size:11px;color:var(--secondary-text-color)">${l}</div>
                      <div style="font-weight:600;font-variant-numeric:tabular-nums;color:var(--primary-text-color)"><span style="color:${c};font-size:10px">${a}</span> ${v > 0 ? '+' : ''}${v.toFixed(2)}°</div></div>`;
                  };
                  return `<div style="display:flex;gap:18px">${cell('sensor.ecm_trend_zona_attiva_20m', '20 min')}${cell('sensor.ecm_trend_zona_attiva_30m', '30 min')}${cell('sensor.ecm_trend_zona_attiva_60m', '60 min')}</div>`;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"i n trend"'
                - grid-template-columns: 22px auto 1fr
                - column-gap: 8px
                - align-items: center
              icon:
                - width: 20px
              custom_fields:
                trend:
                  - justify-self: end

          # Riferimenti calcolati
