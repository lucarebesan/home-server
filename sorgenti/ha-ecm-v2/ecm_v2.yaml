# ECM v2 — dashboard separata (storage key: lovelace.ecm_v2, url: /ecm-v2)
# Sorgente: questo file. Si converte in JSON con build.py.
title: ECM v2

button_card_templates:

  # Base comune: card pulita, colori del tema
  ecm_base:
    color: var(--secondary-text-color)
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 12px
        - height: 100%
        - box-sizing: border-box
      name:
        - font-size: 11px
        - font-weight: 500
        - letter-spacing: 0.04em
        - text-transform: uppercase
        - color: var(--secondary-text-color)
        - justify-self: start
        - text-align: left
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
      state:
        - color: var(--primary-text-color)
        - font-weight: 600
        - justify-self: start
        - text-align: left
        - white-space: nowrap

  # KPI verticale: icona+etichetta sopra, valore grande sotto
  ecm_kpi:
    template: ecm_base
    show_icon: true
    show_name: true
    show_state: true
    variables:
      decimals: 1
      unit: null
    state_display: |
      [[[
        if (!entity) return '—';
        const s = entity.state;
        if (s === 'unavailable' || s === 'unknown') return '—';
        const up = String(s).toUpperCase().trim();
        if (['ON', 'ACCESO', 'TRUE'].includes(up)) return 'ON';
        if (['OFF', 'SPENTO', 'FALSE'].includes(up)) return 'OFF';
        const v = parseFloat(s);
        if (isNaN(v) || !/^-?\d+(\.\d+)?$/.test(String(s).trim())) return s;
        const u = variables.unit !== null ? variables.unit : (entity.attributes.unit_of_measurement || '');
        return `${v.toFixed(variables.decimals)}${u ? '<span style="font-size:12px;font-weight:500;color:var(--secondary-text-color);margin-left:2px">' + u + '</span>' : ''}`;
      ]]]
    styles:
      grid:
        - grid-template-areas: '"i n" "s s"'
        - grid-template-columns: 20px 1fr
        - grid-template-rows: auto 1fr
        - column-gap: 6px
        - align-items: center
      icon:
        - width: 18px
      state:
        - font-size: 20px
        - padding-top: 6px
        - align-self: end

  # Riga orizzontale: icona · etichetta · valore
  ecm_row:
    template: ecm_kpi
    styles:
      grid:
        - grid-template-areas: '"i n s"'
        - grid-template-columns: 22px 1fr auto
        - grid-template-rows: auto
        - column-gap: 8px
      icon:
        - width: 20px
      state:
        - font-size: 17px
        - padding-top: 0
        - align-self: center
        - justify-self: end

  # Intestazione di blocco
  ecm_title:
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: none
    color: var(--primary-color)
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 14px 4px 0 4px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 24px 1fr
        - column-gap: 8px
      icon:
        - width: 22px
      name:
        - font-size: 16px
        - font-weight: 600
        - justify-self: start
        - color: var(--primary-text-color)

  # Pulsante stagione (segmento)
  ecm_stagione:
    entity: input_select.stagione
    show_icon: true
    show_name: true
    show_state: false
    color: var(--secondary-text-color)
    styles:
      card:
        - padding: 10px
        - height: 100%
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: auto auto
        - justify-content: center
        - column-gap: 8px
      icon:
        - width: 20px
      name:
        - font-size: 13px
        - font-weight: 600
        - color: var(--secondary-text-color)

views:


  # ───────────────────────────── STATO ─────────────────────────────
  - title: Stato
    path: stato
    icon: mdi:home-thermometer-outline
    type: sections
    max_columns: 3
    sections:

      # ---- Riga 0: stato a colpo d'occhio (solo lettura) ----
      # Chip informativi. Nessun chip apre controlli: dove l'entità naturale
      # è un comando (stagione, manuale, WRITE) il tocco punta a un sensore
      # in sola lettura, alla tab Albero o non fa nulla.
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            grid_options:
              columns: full
            chips:
              # Stagione (tocco: storico T10, la sonda che la decide)
              - type: template
                entity: sensor.compactp_t10_temperatura_sensore_stanza
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                icon: |-
                  {%- set s = states('input_select.stagione') -%}
                  {{ 'mdi:white-balance-sunny' if s == 'ESTATE' else ('mdi:snowflake' if s == 'INVERNO' else 'mdi:help-circle-outline') }}
                icon_color: |-
                  {%- set s = states('input_select.stagione') -%}
                  {{ 'orange' if s == 'ESTATE' else ('blue' if s == 'INVERNO' else 'grey') }}
                content: |-
                  {%- set s = states('input_select.stagione') -%}
                  {{ 'Estate' if s == 'ESTATE' else ('Inverno' if s == 'INVERNO' else 'Stagione N/D') }}

              # Fascia giorno/notte
              - type: template
                entity: sensor.ecm_fascia_climatica_attiva
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                icon: |-
                  {{ 'mdi:weather-night' if is_state('sensor.ecm_fascia_climatica_attiva', 'NOTTE') else 'mdi:white-balance-sunny' }}
                icon_color: |-
                  {{ 'indigo' if is_state('sensor.ecm_fascia_climatica_attiva', 'NOTTE') else 'amber' }}
                content: |-
                  {%- set f = states('sensor.ecm_fascia_climatica_attiva') -%}
                  {{ 'Notte' if f == 'NOTTE' else ('Giorno' if f == 'GIORNO' else 'Fascia N/D') }}
                  {{- ' · anticipo' if is_state('input_boolean.ecm_notturna_anticipo_attivo', 'on') }}

              # Chi comanda (tocco: tab Albero decisionale)
              - type: template
                tap_action:
                  action: navigate
                  navigation_path: /ecm-v2/albero
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                icon: |-
                  {%- set st = states('input_select.stagione') -%}
                  {%- set man = states('input_select.ecm_manuale') -%}
                  {%- set fc = states('input_select.free_cooling') -%}
                  {%- set fa = states('sensor.ecm_fascia_climatica_attiva') -%}
                  {%- if man not in ['AUTO', 'FREE COOLING', 'unknown', 'unavailable'] -%}
                    {%- set chi, aut = 'man', 'automation.09_ecm_manuale' -%}
                  {%- elif st == 'ESTATE' and fc in ['ATTIVATO', 'PREPARAZIONE'] -%}
                    {%- set chi, aut = 'fc', 'automation.01_ecm_fc_estate' -%}
                  {%- elif st == 'ESTATE' and fa == 'GIORNO' -%}
                    {%- set chi, aut = 'eg', 'automation.01_ecm_eg_estate_fascia_giorno' -%}
                  {%- elif st == 'ESTATE' -%}
                    {%- set chi, aut = 'en', 'automation.01_ecm_en_estate_fascia_notturna' -%}
                  {%- else -%}
                    {%- set chi, aut = 'inv', 'automation.10_ecm_inverno' -%}
                  {%- endif -%}
                  {%- if not is_state(aut, 'on') -%}mdi:pause-circle-outline
                  {%- else -%}{{ {'man': 'mdi:hand-back-right', 'fc': 'mdi:weather-windy', 'eg': 'mdi:robot', 'en': 'mdi:robot', 'inv': 'mdi:robot'}[chi] }}
                  {%- endif -%}
                icon_color: |-
                  {%- set st = states('input_select.stagione') -%}
                  {%- set man = states('input_select.ecm_manuale') -%}
                  {%- set fc = states('input_select.free_cooling') -%}
                  {%- set fa = states('sensor.ecm_fascia_climatica_attiva') -%}
                  {%- if man not in ['AUTO', 'FREE COOLING', 'unknown', 'unavailable'] -%}
                    {%- set chi, aut = 'man', 'automation.09_ecm_manuale' -%}
                  {%- elif st == 'ESTATE' and fc in ['ATTIVATO', 'PREPARAZIONE'] -%}
                    {%- set chi, aut = 'fc', 'automation.01_ecm_fc_estate' -%}
                  {%- elif st == 'ESTATE' and fa == 'GIORNO' -%}
                    {%- set chi, aut = 'eg', 'automation.01_ecm_eg_estate_fascia_giorno' -%}
                  {%- elif st == 'ESTATE' -%}
                    {%- set chi, aut = 'en', 'automation.01_ecm_en_estate_fascia_notturna' -%}
                  {%- else -%}
                    {%- set chi, aut = 'inv', 'automation.10_ecm_inverno' -%}
                  {%- endif -%}
                  {%- if not is_state(aut, 'on') -%}grey
                  {%- else -%}{{ {'man': 'purple', 'fc': 'teal', 'eg': 'primary', 'en': 'primary', 'inv': 'primary'}[chi] }}
                  {%- endif -%}
                content: |-
                  {%- set st = states('input_select.stagione') -%}
                  {%- set man = states('input_select.ecm_manuale') -%}
                  {%- set fc = states('input_select.free_cooling') -%}
                  {%- set fa = states('sensor.ecm_fascia_climatica_attiva') -%}
                  {%- if man not in ['AUTO', 'FREE COOLING', 'unknown', 'unavailable'] -%}
                    {%- set chi, aut = 'man', 'automation.09_ecm_manuale' -%}
                  {%- elif st == 'ESTATE' and fc in ['ATTIVATO', 'PREPARAZIONE'] -%}
                    {%- set chi, aut = 'fc', 'automation.01_ecm_fc_estate' -%}
                  {%- elif st == 'ESTATE' and fa == 'GIORNO' -%}
                    {%- set chi, aut = 'eg', 'automation.01_ecm_eg_estate_fascia_giorno' -%}
                  {%- elif st == 'ESTATE' -%}
                    {%- set chi, aut = 'en', 'automation.01_ecm_en_estate_fascia_notturna' -%}
                  {%- else -%}
                    {%- set chi, aut = 'inv', 'automation.10_ecm_inverno' -%}
                  {%- endif -%}
                  {%- if chi == 'man' -%}
                    Manuale {{ man.split(' ')[0] }}{{ '' if is_state(aut, 'on') else ' · non applicato' }}
                  {%- elif not is_state(aut, 'on') -%}
                    Nilan da solo · ECM spenta
                  {%- else -%}
                    {{ {'fc': 'Free cooling', 'eg': 'ECM Giorno', 'en': 'ECM Notte', 'inv': 'ECM Inverno'}[chi] }}
                  {%- endif -%}

              # WRITE: nessun tocco (il more-info di un'automazione ha l'interruttore)
              - type: template
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                icon: |-
                  {{ 'mdi:pencil' if is_state('automation.nilan_write', 'on') else 'mdi:pencil-off' }}
                icon_color: |-
                  {{ 'green' if is_state('automation.nilan_write', 'on') else 'red' }}
                content: |-
                  {{ 'WRITE attiva' if is_state('automation.nilan_write', 'on') else 'WRITE spenta: nessun comando' }}

              # Reale vs obiettivo
              - type: template
                entity: sensor.ecm_configurazione_reale
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                icon: |-
                  {%- set r = states('sensor.ecm_configurazione_reale') -%}
                  {%- set o = states('input_number.livello_emc') -%}
                  {%- if r is match('^E\\d+$') and is_number(o) and r[1:] | int == o | float | round(0) | int -%}mdi:check-circle-outline
                  {%- elif r is match('^E\\d+$') and is_number(o) -%}mdi:sync
                  {%- else -%}mdi:alert-circle-outline{%- endif -%}
                icon_color: |-
                  {%- set st = states('input_select.stagione') -%}
                  {%- set man = states('input_select.ecm_manuale') -%}
                  {%- set fc = states('input_select.free_cooling') -%}
                  {%- set fa = states('sensor.ecm_fascia_climatica_attiva') -%}
                  {%- if man not in ['AUTO', 'FREE COOLING', 'unknown', 'unavailable'] -%}{%- set aut = 'automation.09_ecm_manuale' -%}
                  {%- elif st == 'ESTATE' and fc in ['ATTIVATO', 'PREPARAZIONE'] -%}{%- set aut = 'automation.01_ecm_fc_estate' -%}
                  {%- elif st == 'ESTATE' and fa == 'GIORNO' -%}{%- set aut = 'automation.01_ecm_eg_estate_fascia_giorno' -%}
                  {%- elif st == 'ESTATE' -%}{%- set aut = 'automation.01_ecm_en_estate_fascia_notturna' -%}
                  {%- else -%}{%- set aut = 'none' -%}{%- endif -%}
                  {%- set r = states('sensor.ecm_configurazione_reale') -%}
                  {%- set o = states('input_number.livello_emc') -%}
                  {%- if not (r is match('^E\\d+$') and is_number(o)) -%}red
                  {%- elif r[1:] | int == o | float | round(0) | int -%}green
                  {%- elif is_state(aut, 'on') and is_state('automation.nilan_write', 'on') -%}orange
                  {%- else -%}grey{%- endif -%}
                content: |-
                  {%- set r = states('sensor.ecm_configurazione_reale') -%}
                  {%- set o = states('input_number.livello_emc') -%}
                  {%- if not (r is match('^E\\d+$') and is_number(o)) -%}Configurazione non riconosciuta
                  {%- elif r[1:] | int == o | float | round(0) | int -%}{{ r }} allineato
                  {%- else -%}Reale {{ r }} · obiettivo E{{ o | float | round(0) | int }}{%- endif -%}

              # Acqua calda
              - type: template
                entity: sensor.compactp_t11_temperatura_bollitore_parte_alta
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                icon: mdi:water-boiler
                icon_color: |-
                  {%- set res = states('sensor.compactp_resistenza_elettrica_acs') | upper in ['ON', '1', 'TRUE', 'ACCESO'] -%}
                  {%- set sp = states('sensor.compactp_setpoint_acs_compressore') | float(0) -%}
                  {%- set t12 = states('sensor.compactp_t12_temperatura_bollitore_parte_bassa') | float(99) -%}
                  {%- set t11 = states('sensor.compactp_t11_temperatura_bollitore_parte_alta') -%}
                  {%- if res or (sp >= 40 and t12 <= sp - 0.5) -%}deep-orange
                  {%- elif is_number(t11) and t11 | float < 42 -%}blue
                  {%- else -%}grey{%- endif -%}
                content: |-
                  {%- set res = states('sensor.compactp_resistenza_elettrica_acs') | upper in ['ON', '1', 'TRUE', 'ACCESO'] -%}
                  {%- set sp = states('sensor.compactp_setpoint_acs_compressore') | float(0) -%}
                  {%- set t12 = states('sensor.compactp_t12_temperatura_bollitore_parte_bassa') | float(99) -%}
                  {%- set t11 = states('sensor.compactp_t11_temperatura_bollitore_parte_alta') -%}
                  {%- set cp_on = states('sensor.compactp_compressore') | upper in ['ON', '1', 'TRUE', 'ACCESO'] -%}
                  {%- set cp_chiede = sp >= 40 and t12 <= sp - 0.5 -%}
                  {%- set t = (t11 | float | round(0) | int ~ '°') if is_number(t11) else '—' -%}
                  {%- if res and cp_chiede and cp_on -%}ACS {{ t }} · in carica CP + resistenza
                  {%- elif res -%}ACS {{ t }} · in carica con resistenza
                  {%- elif cp_chiede and cp_on -%}ACS {{ t }} · in carica con CP
                  {%- elif cp_chiede -%}ACS {{ t }} · attende il CP
                  {%- else -%}ACS {{ t }}{%- endif -%}

      # ---- Colonna 1: modalità + clima ----
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.ecm_fascia_climatica_attiva
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: more-info
              entity: sensor.ecm_configurazione_reale
            grid_options:
              columns: full
            triggers_update:
              - sensor.ecm_fascia_climatica_attiva
              - sensor.ecm_configurazione_reale
              - input_number.livello_emc
              - input_select.free_cooling
              - input_select.ecm_manuale
              - input_select.stagione
              - input_boolean.ecm_notturna_anticipo_attivo
              - sensor.compactp_compressore
              - sensor.compactp_ventilazione_selezionata
              - sensor.toshiba_on_off_unita
              - sensor.toshiba_modo_unita
              - sensor.toshiba_velocita_ventilatore
              - automation.09_ecm_manuale
              - automation.01_ecm_fc_estate
              - automation.01_ecm_eg_estate_fascia_giorno
              - automation.01_ecm_en_estate_fascia_notturna
              - automation.10_ecm_inverno
              - automation.nilan_write
            variables:
              modo: |
                [[[
                  const fc = states['input_select.free_cooling']?.state;
                  const man = states['input_select.ecm_manuale']?.state;
                  const ant = states['input_boolean.ecm_notturna_anticipo_attivo']?.state;
                  const fascia = states['sensor.ecm_fascia_climatica_attiva']?.state;
                  // In inverno EG/EN non girano: niente sigla per non suggerire una logica attiva
                  const inv = states['input_select.stagione']?.state === 'INVERNO';
                  if (fc === 'ATTIVATO') return {k: 'FC', t: 'Free cooling', d: '', c: 'var(--teal-color)', i: 'mdi:snowflake'};
                  if (man && man !== 'AUTO' && man !== 'FREE COOLING') return {k: 'MAN', t: 'Manuale', d: man, c: 'var(--purple-color)', i: 'mdi:hand-back-right'};
                  if (ant === 'on') return {k: inv ? '' : 'EN', t: 'Notte · anticipo', d: '', c: 'var(--indigo-color)', i: 'mdi:weather-night'};
                  if (fascia === 'NOTTE') return {k: inv ? '' : 'EN', t: 'Notte', d: '', c: 'var(--indigo-color)', i: 'mdi:weather-night'};
                  const nota = fc === 'PREPARAZIONE' ? 'Free cooling in preparazione' : (fc === 'FALLITO' ? 'Free cooling fallito' : '');
                  return {k: inv ? '' : 'EG', t: 'Giorno', d: nota, c: 'var(--amber-color)', i: 'mdi:white-balance-sunny'};
                ]]]
              stagione: |
                [[[
                  const s = states['input_select.stagione']?.state;
                  if (s === 'ESTATE') return {t: 'ESTATE', c: 'var(--orange-color)', i: 'mdi:white-balance-sunny'};
                  if (s === 'INVERNO') return {t: 'INVERNO', c: 'var(--blue-color)', i: 'mdi:snowflake'};
                  return {t: 'N/D', c: 'var(--secondary-text-color)', i: 'mdi:help'};
                ]]]
              logica: |
                [[[
                  // Quale automazione dovrebbe applicare l'obiettivo, e se è accesa
                  const st = states['input_select.stagione']?.state;
                  const man = states['input_select.ecm_manuale']?.state;
                  const fc = states['input_select.free_cooling']?.state;
                  const fa = states['sensor.ecm_fascia_climatica_attiva']?.state;
                  let aut = null;
                  if (man && !['AUTO', 'FREE COOLING', 'unknown', 'unavailable'].includes(man)) aut = 'automation.09_ecm_manuale';
                  else if (st === 'ESTATE' && ['ATTIVATO', 'PREPARAZIONE'].includes(fc)) aut = 'automation.01_ecm_fc_estate';
                  else if (st === 'ESTATE') aut = fa === 'GIORNO' ? 'automation.01_ecm_eg_estate_fascia_giorno' : 'automation.01_ecm_en_estate_fascia_notturna';
                  return {
                    aut: aut,
                    attiva: aut !== null && states[aut]?.state === 'on',
                    inverno: aut === null && st === 'INVERNO',
                    write: states['automation.nilan_write']?.state === 'on'
                  };
                ]]]
              reale: |
                [[[
                  const up = (e) => String(states[e]?.state ?? '').toUpperCase().trim();
                  const comp = up('sensor.compactp_compressore');
                  const vent = up('sensor.compactp_ventilazione_selezionata');
                  let cp = 'N/D';
                  if (['ON', 'ACCESO', '1', 'TRUE'].includes(comp)) cp = 'ON';
                  else if (['OFF', 'SPENTO', '0', 'FALSE'].includes(comp)) cp = 'OFF';
                  const vmap = {'OFF': 'V0', 'STEP 2': 'V2', 'STEP 3': 'V3', 'STEP 4': 'V4'};
                  const cpv = vmap[vent] || 'N/D';
                  const son = up('sensor.toshiba_on_off_unita');
                  const smo = up('sensor.toshiba_modo_unita');
                  const sve = up('sensor.toshiba_velocita_ventilatore');
                  let split = 'Split N/D';
                  if (['OFF', 'SPENTO', '0'].includes(son)) split = 'Split OFF';
                  else if (son) {
                    let m = 'N/D', v = 'N/D';
                    if (['DEUMIDIFICATORE', 'DEUMIDIFICAZIONE', 'DRY', '2'].includes(smo)) m = 'DRY';
                    else if (['RAFFRESCAMENTO', 'COOL', '4'].includes(smo)) m = 'COOL';
                    else if (['RISCALDAMENTO', 'HEAT', '1'].includes(smo)) m = 'HEAT';
                    if (['BASSA', 'LOW', '1'].includes(sve)) v = 'V1';
                    else if (['MEDIA', 'MID', '2'].includes(sve)) v = 'V2';
                    else if (['ALTA', 'HIGH', 'HIGT', '3'].includes(sve)) v = 'V3';
                    split = `Split ${m} ${v}`;
                  }
                  const code = states['sensor.ecm_configurazione_reale']?.state ?? '';
                  return {code: /^E\d+$/.test(code) ? code : '—', txt: `CP ${cp} ${cpv} · ${split}`};
                ]]]
              obiettivo: |
                [[[
                  const n = Math.round(Number(states['input_number.livello_emc']?.state));
                  if (isNaN(n)) return {code: '—', txt: 'N/D'};
                  const cp = {0: 'CP OFF V0', 1: 'CP OFF V2', 2: 'CP OFF V3', 3: 'CP OFF V4', 4: 'CP ON V2', 5: 'CP ON V3', 6: 'CP ON V4'};
                  const sp = {0: 'Split OFF', 1: 'Split DRY V1', 2: 'Split DRY V2', 3: 'Split DRY V3', 4: 'Split COOL V1', 5: 'Split COOL V2', 6: 'Split COOL V3'};
                  return {code: `E${n}`, txt: `${cp[n % 10] || 'CP N/D'} · ${sp[Math.floor(n / 10)] || 'Split N/D'}`};
                ]]]
              esito: |
                [[[
                  const r = states['sensor.ecm_configurazione_reale']?.state ?? '';
                  const o = Number(states['input_number.livello_emc']?.state);
                  const l = variables.logica;
                  if (!/^E\d+$/.test(r) || isNaN(o)) return {t: 'Configurazione reale non riconosciuta', c: 'var(--error-color)', i: 'mdi:alert-circle-outline'};
                  if (Number(r.slice(1)) === Math.round(o)) return {t: 'Allineato', c: 'var(--success-color)', i: 'mdi:check-circle-outline'};
                  if (!l.write) return {t: 'WRITE spenta: l\'obiettivo non viene inviato', c: 'var(--warning-color)', i: 'mdi:pencil-off'};
                  if (l.inverno) return {t: 'In inverno l\'obiettivo E non viene applicato', c: 'var(--secondary-text-color)', i: 'mdi:information-outline'};
                  if (!l.attiva) return {t: 'Obiettivo non applicato: automazione ECM spenta', c: 'var(--secondary-text-color)', i: 'mdi:pause-circle-outline'};
                  return {t: 'In transizione', c: 'var(--warning-color)', i: 'mdi:sync'};
                ]]]
            custom_fields:
              ico: |
                [[[
                  const m = variables.modo;
                  return `<div style="width:52px;height:52px;border-radius:50%;background:color-mix(in srgb, ${m.c} 14%, transparent);display:flex;align-items:center;justify-content:center">
                    <ha-icon icon="${m.i}" style="--mdc-icon-size:28px;color:${m.c}"></ha-icon></div>`;
                ]]]
              titolo: |
                [[[
                  const m = variables.modo;
                  return `<div style="font-size:11px;letter-spacing:.06em;color:var(--secondary-text-color);text-transform:uppercase">Modalità ECM</div>
                    <div style="font-size:22px;font-weight:700;color:var(--primary-text-color);line-height:1.2">${m.t}
                    <span style="font-size:13px;font-weight:600;color:${m.c};margin-left:4px">${m.k}</span></div>
                    ${m.d ? `<div style="font-size:12px;color:var(--secondary-text-color);white-space:normal">${m.d}</div>` : ''}`;
                ]]]
              stag: |
                [[[
                  const s = variables.stagione;
                  return `<span style="display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb, ${s.c} 14%, transparent);color:${s.c};padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em">
                    <ha-icon icon="${s.i}" style="--mdc-icon-size:14px;margin:0;width:14px"></ha-icon>${s.t}</span>`;
                ]]]
              cfg: |
                [[[
                  const r = variables.reale, o = variables.obiettivo, e = variables.esito;
                  const lab = 'font-size:11px;letter-spacing:.05em;color:var(--secondary-text-color);text-transform:uppercase';
                  const code = 'font-weight:700;color:var(--primary-text-color);font-variant-numeric:tabular-nums';
                  return `<div style="width:100%;text-align:left"><div style="display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--divider-color);font-size:13px;text-align:left">
                    <span style="${lab}">Reale</span><span style="${code}">${r.code}</span><span style="color:var(--primary-text-color)">${r.txt}</span>
                    <span style="${lab}">Obiettivo</span><span style="${code}">${o.code}</span><span style="color:var(--primary-text-color)">${o.txt}</span>
                    </div>
                    <div style="display:flex;justify-content:flex-start;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:${e.c}">
                    <ha-icon icon="${e.i}" style="--mdc-icon-size:16px;margin:0;width:16px;flex:none"></ha-icon><span style="white-space:normal">${e.t}</span></div></div>`;
                ]]]
            styles:
              card:
                - padding: 16px
              grid:
                - grid-template-areas: '"ico titolo stag" "cfg cfg cfg"'
                - grid-template-columns: 52px 1fr auto
                - column-gap: 12px
                - align-items: center
              custom_fields:
                titolo:
                  - justify-self: start
                  - text-align: left
                stag:
                  - align-self: start
                cfg:
                  - justify-self: stretch

          # Rimando all'albero decisionale (sostituisce il markdown lungo)
          - type: custom:button-card
            template: ecm_base
            name: Albero decisionale
            icon: mdi:file-tree-outline
            show_icon: true
            show_name: true
            show_state: false
            color: var(--primary-color)
            tap_action:
              action: navigate
              navigation_path: /ecm-v2/albero
            grid_options:
              columns: full
            triggers_update:
              - input_select.stagione
              - input_select.ecm_manuale
              - input_select.free_cooling
              - sensor.ecm_fascia_climatica_attiva
              - automation.09_ecm_manuale
              - automation.01_ecm_fc_estate
              - automation.01_ecm_eg_estate_fascia_giorno
              - automation.01_ecm_en_estate_fascia_notturna
              - automation.10_ecm_inverno
            custom_fields:
              chi: |
                [[[
                  const st = states['input_select.stagione']?.state;
                  const man = states['input_select.ecm_manuale']?.state;
                  const fc = states['input_select.free_cooling']?.state;
                  const fa = states['sensor.ecm_fascia_climatica_attiva']?.state;
                  const on = (a) => states[a]?.state === 'on';
                  let t, d;
                  if (man && !['AUTO', 'FREE COOLING', 'unknown', 'unavailable'].includes(man)) {
                    const c = man.split(' ')[0];
                    t = `Manuale ${c}`;
                    d = on('automation.09_ecm_manuale') ? 'Scelta manuale temporanea' : 'Non applicato: ECM Manuale spenta per scelta';
                  } else {
                    let aut, nome;
                    if (st === 'ESTATE' && ['ATTIVATO', 'PREPARAZIONE'].includes(fc)) { aut = 'automation.01_ecm_fc_estate'; nome = 'Free cooling'; }
                    else if (st === 'ESTATE' && fa === 'GIORNO') { aut = 'automation.01_ecm_eg_estate_fascia_giorno'; nome = 'ECM Giorno'; }
                    else if (st === 'ESTATE') { aut = 'automation.01_ecm_en_estate_fascia_notturna'; nome = 'ECM Notte'; }
                    else { aut = 'automation.10_ecm_inverno'; nome = 'ECM Inverno'; }
                    if (on(aut)) { t = nome; d = ''; }
                    else { t = 'Il Nilan decide da solo'; d = `${nome} spenta per scelta: Nilan e Toshiba seguono le proprie impostazioni`; }
                  }
                  return `<div style="text-align:left;margin-top:6px">
                    <div style="font-size:15px;font-weight:600;color:var(--primary-text-color)">Chi comanda: ${t}</div>
                    ${d ? `<div style="font-size:12px;color:var(--secondary-text-color);white-space:normal">${d}</div>` : ''}</div>`;
                ]]]
              freccia: |
                [[[ return `<ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:22px;color:var(--secondary-text-color)"></ha-icon>`; ]]]
            styles:
              grid:
                - grid-template-areas: '"i n freccia" "chi chi freccia"'
                - grid-template-columns: 22px 1fr auto
                - column-gap: 8px
                - align-items: center
              icon:
                - width: 20px
              name:
                - text-transform: none
                - letter-spacing: 0
                - font-size: 12px
              custom_fields:
                chi:
                  - justify-self: stretch
                freccia:
                  - align-self: center
          - type: custom:button-card
            template: ecm_title
            name: Clima
            icon: mdi:home-thermometer-outline
            grid_options:
              columns: full
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.egwk_temp_aria_esterna_prima_egwk
            name: Esterna
