type: sections
max_columns: 2
title: ECM
path: ecm
icon: mdi:home-thermometer-outline
sections:
- type: grid
  cards:
  - type: markdown
    content: '# 🏠 ECM'
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      entity: input_select.stagione
      icon: mdi:sun-thermometer
      show_name: false
      styles:
        card:
        - box-shadow: none
        - padding: 0
        - margin: 0
        - background: transparent
        icon:
        - width: 40px
        - height: 40px
      tap_action:
        action: call-service
        service: input_select.select_option
        service_data:
          entity_id: input_select.stagione
          option: ESTATE
      state:
      - value: ESTATE
        styles:
          icon:
          - color: orange
      - value: INVERNO
        styles:
          icon:
          - color: gray
    - type: custom:button-card
      entity: input_select.stagione
      icon: mdi:snowflake-thermometer
      show_name: false
      styles:
        card:
        - box-shadow: none
        - padding: 0
        - margin: 0
        - background: transparent
        icon:
        - width: 40px
        - height: 40px
      tap_action:
        action: call-service
        service: input_select.select_option
        service_data:
          entity_id: input_select.stagione
          option: INVERNO
      state:
      - value: INVERNO
        styles:
          icon:
          - color: deepskyblue
      - value: ESTATE
        styles:
          icon:
          - color: gray
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      entity: sensor.ecm_fascia_climatica_attiva
      show_name: false
      show_state: true
      size: 40px
      triggers_update:
      - sensor.ecm_fascia_climatica_attiva
      - input_select.free_cooling
      - input_select.ecm_manuale
      - input_boolean.ecm_notturna_anticipo_attivo
      icon: "[[[\n  const fc = states['input_select.free_cooling']?.state;\n  const manuale = states['input_select.ecm_manuale']?.state;\n  const anticipo = states['input_boolean.ecm_notturna_anticipo_attivo']?.state;\n\
        \  const fascia = states['sensor.ecm_fascia_climatica_attiva']?.state;\n\n  if (fc === 'ATTIVATO') return 'mdi:snowflake';\n  if (manuale && manuale !== 'AUTO') return 'mdi:hand-back-right';\n \
        \ if (anticipo === 'on' || fascia === 'NOTTE') return 'mdi:weather-night';\n  return 'mdi:white-balance-sunny';\n]]]\n"
      state_display: "[[[\n  const fc = states['input_select.free_cooling']?.state;\n  const manuale = states['input_select.ecm_manuale']?.state;\n  const anticipo = states['input_boolean.ecm_notturna_anticipo_attivo']?.state;\n\
        \  const fascia = states['sensor.ecm_fascia_climatica_attiva']?.state;\n\n  if (fc === 'ATTIVATO') return 'FC';\n  if (manuale && manuale !== 'AUTO') return 'MAN';\n  if (anticipo === 'on' || fascia\
        \ === 'NOTTE') return 'EN';\n  return 'EG';\n]]]\n"
      tap_action:
        action: more-info
      styles:
        icon:
        - color: "[[[\n  const fc = states['input_select.free_cooling']?.state;\n  const manuale = states['input_select.ecm_manuale']?.state;\n  const anticipo = states['input_boolean.ecm_notturna_anticipo_attivo']?.state;\n\
            \  const fascia = states['sensor.ecm_fascia_climatica_attiva']?.state;\n\n  if (fc === 'ATTIVATO') return '#26c6da';\n  if (manuale && manuale !== 'AUTO') return '#ab47bc';\n  if (anticipo ===\
            \ 'on' || fascia === 'NOTTE') return '#42a5f5';\n  return '#f9a825';\n]]]\n"
        state:
        - font-size: 14px
        - font-weight: bold
        - color: white
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      entity: sensor.ecm_configurazione_reale
      name: ECM REALE
      icon: mdi:home-thermometer
      show_icon: true
      show_name: true
      show_state: true
      triggers_update:
      - sensor.ecm_configurazione_reale
      - input_number.livello_emc
      - sensor.compactp_compressore
      - sensor.compactp_ventilazione_selezionata
      - sensor.toshiba_on_off_unita
      - sensor.toshiba_modo_unita
      - sensor.toshiba_velocita_ventilatore
      tap_action:
        action: more-info
      state_display: "[[[\n  const statoCompressore =\n    states['sensor.compactp_compressore'];\n\n  const statoVentilazione =\n    states['sensor.compactp_ventilazione_selezionata'];\n\n  const compressore\
        \ = String(\n    statoCompressore ? statoCompressore.state : ''\n  ).toUpperCase().trim();\n\n  const ventilazione = String(\n    statoVentilazione ? statoVentilazione.state : ''\n  ).toUpperCase().trim();\n\
        \n  let cpOnOff = 'N/D';\n  let cpVelocita = 'N/D';\n\n  if (['ON', 'ACCESO', '1', 'TRUE'].includes(compressore))\n    cpOnOff = 'ON';\n  else if (['OFF', 'SPENTO', '0', 'FALSE'].includes(compressore))\n\
        \    cpOnOff = 'OFF';\n\n  if (ventilazione === 'OFF')\n    cpVelocita = 'V0';\n  else if (ventilazione === 'STEP 2')\n    cpVelocita = 'V2';\n  else if (ventilazione === 'STEP 3')\n    cpVelocita\
        \ = 'V3';\n  else if (ventilazione === 'STEP 4')\n    cpVelocita = 'V4';\n\n  const statoSplitOnOff =\n    states['sensor.toshiba_on_off_unita'];\n\n  const statoSplitModo =\n    states['sensor.toshiba_modo_unita'];\n\
        \n  const statoSplitVentilatore =\n    states['sensor.toshiba_velocita_ventilatore'];\n\n  const splitOnOff = String(\n    statoSplitOnOff ? statoSplitOnOff.state : ''\n  ).toUpperCase().trim();\n\
        \n  const splitModo = String(\n    statoSplitModo ? statoSplitModo.state : ''\n  ).toUpperCase().trim();\n\n  const splitVentilatore = String(\n    statoSplitVentilatore ? statoSplitVentilatore.state\
        \ : ''\n  ).toUpperCase().trim();\n\n  let splitDescrizione = 'SPLIT N/D';\n\n  if (['OFF', 'SPENTO', '0'].includes(splitOnOff)) {\n    splitDescrizione = 'SPLIT OFF';\n  } else {\n    let modo\
        \ = 'N/D';\n    let velocita = 'N/D';\n\n    if (\n      [\n        'DEUMIDIFICATORE',\n        'DEUMIDIFICAZIONE',\n        'DRY',\n        '2'\n      ].includes(splitModo)\n    )\n      modo =\
        \ 'DRY';\n    else if (\n      [\n        'RAFFRESCAMENTO',\n        'COOL',\n        '4'\n      ].includes(splitModo)\n    )\n      modo = 'COOL';\n\n    if (\n      ['BASSA', 'LOW', '1'].includes(splitVentilatore)\n\
        \    )\n      velocita = 'V1';\n    else if (\n      ['MEDIA', 'MID', '2'].includes(splitVentilatore)\n    )\n      velocita = 'V2';\n    else if (\n      ['ALTA', 'HIGH', 'HIGT', '3'].includes(splitVentilatore)\n\
        \    )\n      velocita = 'V3';\n\n    splitDescrizione = `SPLIT ${modo} ${velocita}`;\n  }\n\n  return `CP ${cpOnOff} ${cpVelocita} + ${splitDescrizione}`;\n]]]\n"
      styles:
        grid:
        - grid-template-areas: '"i n" "s s"'
        - grid-template-columns: 28px 1fr
        - grid-template-rows: auto auto
        - align-items: center
        card:
        - padding: 8px 10px
        icon:
        - width: 24px
        - color: var(--state-icon-color)
        name:
        - font-size: 12px
        - font-weight: bold
        - justify-self: start
        - color: "[[[\n  return (\n    !states['sensor.ecm_configurazione_reale'] ||\n    !states['input_number.livello_emc'] ||\n    !/^E\\d+$/.test(states['sensor.ecm_configurazione_reale'].state) ||\n\
            \    isNaN(Number(states['input_number.livello_emc'].state))\n  )\n    ? '#ef5350'\n    : Number(\n        states['sensor.ecm_configurazione_reale'].state\n        .replace('E', '')\n      )\
            \ === Math.round(\n        Number(states['input_number.livello_emc'].state)\n      )\n        ? '#66bb6a'\n        : '#ffa726';\n]]]\n"
        state:
        - font-size: 12px
        - font-weight: bold
        - color: white
        - justify-self: center
        - padding-top: 6px
        - white-space: normal
        - text-align: center
    - type: custom:button-card
      entity: input_number.livello_emc
      name: ECM OBIETTIVO
      icon: mdi:target
      show_icon: true
      show_name: true
      show_state: true
      triggers_update:
      - sensor.ecm_configurazione_reale
      - input_number.livello_emc
      tap_action:
        action: more-info
      state_display: "[[[\n  const codice = Math.round(Number(entity.state));\n\n  if (isNaN(codice))\n    return 'CP N/D + SPLIT N/D';\n\n  const splitId = Math.floor(codice / 10);\n  const cpId = codice\
        \ % 10;\n\n  const cp = {\n    0: 'CP OFF V0',\n    1: 'CP OFF V2',\n    2: 'CP OFF V3',\n    3: 'CP OFF V4',\n    4: 'CP ON V2',\n    5: 'CP ON V3',\n    6: 'CP ON V4'\n  };\n\n  const split =\
        \ {\n    0: 'SPLIT OFF',\n    1: 'SPLIT DRY V1',\n    2: 'SPLIT DRY V2',\n    3: 'SPLIT DRY V3',\n    4: 'SPLIT COOL V1',\n    5: 'SPLIT COOL V2',\n    6: 'SPLIT COOL V3'\n  };\n\n  return `${cp[cpId]\
        \ || 'CP N/D'} + ${split[splitId] || 'SPLIT N/D'}`;\n]]]\n"
      styles:
        grid:
        - grid-template-areas: '"i n" "s s"'
        - grid-template-columns: 28px 1fr
        - grid-template-rows: auto auto
        - align-items: center
        card:
        - padding: 8px 10px
        icon:
        - width: 24px
        - color: var(--state-icon-color)
        name:
        - font-size: 12px
        - font-weight: bold
        - justify-self: start
        - color: "[[[\n  return (\n    !states['sensor.ecm_configurazione_reale'] ||\n    !states['input_number.livello_emc'] ||\n    !/^E\\d+$/.test(states['sensor.ecm_configurazione_reale'].state) ||\n\
            \    isNaN(Number(states['input_number.livello_emc'].state))\n  )\n    ? '#ef5350'\n    : Number(\n        states['sensor.ecm_configurazione_reale'].state\n        .replace('E', '')\n      )\
            \ === Math.round(\n        Number(states['input_number.livello_emc'].state)\n      )\n        ? '#66bb6a'\n        : '#ffa726';\n]]]\n"
        state:
        - font-size: 12px
        - font-weight: bold
        - color: white
        - justify-self: center
        - padding-top: 6px
        - white-space: normal
        - text-align: center
