            content: |-
              Il compressore si accende e si spegne a metà isteresi ({{ '%.1f' | format(states('input_number.isteresi') | float(0) / 2) | replace('.', ',') }} °C) sopra e sotto il setpoint.

          - type: heading
            heading: Cambio stagione automatico
            heading_style: subtitle
            icon: mdi:sun-snowflake-variant
          - type: custom:mushroom-number-card
            entity: input_number.commutazione_estate_inverno
            name: Soglia T10
            icon: mdi:thermometer
            icon_color: grey
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.isteresi_commutazione_estate_inverno
            name: Isteresi stagione
            icon: mdi:swap-horizontal
            icon_color: grey
            display_mode: buttons
            grid_options:
              columns: 6
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              {%- set s = states('input_number.commutazione_estate_inverno') | float(22.5) -%}
              {%- set i = states('input_number.isteresi_commutazione_estate_inverno') | float(2) -%}
              Inverno sotto {{ '%.1f' | format(s) | replace('.', ',') }} °C, estate sopra soglia + isteresi ({{ '%.1f' | format(s + i) | replace('.', ',') }} °C). Le usa anche il motore ECM.
              {%- if is_state('automation.00_nilan_cambio_stagione_automatico_t10', 'off') %} Il cambio automatico è spento per scelta.{% endif %}

          - type: heading
            heading: Coefficienti ECM
            heading_style: subtitle
