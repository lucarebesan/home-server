            template: ecm_base
            entity: sensor.ecm_target_comfort
            show_icon: false
            show_name: false
            show_state: false
            grid_options:
              columns: full
            triggers_update:
              - sensor.ecm_target_comfort
              - sensor.ecm_target_accumulo
              - sensor.ecm_limite_inferiore
              - sensor.ecm_limite_superiore
            custom_fields:
              rif: |
                [[[
                  const f = (e) => { const v = parseFloat(states[e]?.state); return isNaN(v) ? '—' : v.toFixed(1); };
                  const box = (l, v) => `<div style="flex:1;min-width:0"><div style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--secondary-text-color)">${l}</div>
                    <div style="font-size:15px;font-weight:600;color:var(--primary-text-color);font-variant-numeric:tabular-nums">${v}</div></div>`;
                  return `<div style="display:flex;gap:10px;text-align:left">
                    ${box('Comfort', f('sensor.ecm_target_comfort') + '°')}
                    ${box('Accumulo', f('sensor.ecm_target_accumulo') + '°')}
                    ${box('Limiti', f('sensor.ecm_limite_inferiore') + '–' + f('sensor.ecm_limite_superiore') + '°')}
                  </div>`;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"rif"'
              custom_fields:
                rif:
                  - justify-self: stretch


