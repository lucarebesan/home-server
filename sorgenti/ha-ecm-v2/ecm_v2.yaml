          - type: custom:mushroom-number-card
            entity: input_number.ecm_coefficiente_comfort
            name: Comfort
            icon: mdi:tune-variant
            icon_color: grey
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.ecm_target_comfort
            name: → Comfort
            icon: mdi:thermometer
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.ecm_coefficiente_accumulo
            name: Accumulo
            icon: mdi:tune-variant
            icon_color: grey
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.ecm_target_accumulo
            name: → Accumulo
            icon: mdi:thermometer
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.ecm_coefficiente_tmin
            name: Limite
            icon: mdi:tune-variant
            icon_color: grey
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.ecm_limite_superiore
            name: → Limiti
            icon: mdi:arrow-collapse-vertical
            triggers_update:
              - sensor.ecm_limite_inferiore
              - sensor.ecm_limite_superiore
            tap_action:
              action: none
            state_display: |
              [[[
                const f = (id) => {
                  const s = states[id];
                  const v = s ? parseFloat(s.state) : NaN;
                  return isNaN(v) ? '—' : v.toFixed(1).replace('.', ',');
                };
                return `${f('sensor.ecm_limite_inferiore')} – ${f('sensor.ecm_limite_superiore')}<span style="font-size:12px;font-weight:500;color:var(--secondary-text-color);margin-left:2px">°C</span>`;
              ]]]
            grid_options:
              columns: 6
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              {%- set d = states('input_number.delta_confort') | float(0) -%}
              {%- if is_state('input_select.stagione', 'ESTATE') -%}
              {%- set b = states('input_number.t_max_estate') | float(0) -%}
              Estate: temperatura = Max estate ({{ '%.1f' | format(b) | replace('.', ',') }}) − coefficiente × Δ comfort ({{ '%.1f' | format(d) | replace('.', ',') }}). Il coefficiente limite dà il limite inferiore; il superiore è Max estate.
              {%- else -%}
              {%- set b = states('input_number.t_inverno') | float(0) -%}
              Inverno: temperatura = Set inverno ({{ '%.1f' | format(b) | replace('.', ',') }}) + coefficiente × Δ comfort ({{ '%.1f' | format(d) | replace('.', ',') }}). Il coefficiente limite dà il limite superiore; l'inferiore è Min inverno.
              {%- endif %}

  # ───────────────────────────── DIAGNOSTICA ─────────────────────────────
  - title: Diagnostica
    path: diagnostica
    icon: mdi:stethoscope
    type: sections
    max_columns: 3
    sections:
      # 1 · Salute: problemi prima di tutto
      - type: grid
        cards:
          - type: heading
            heading: Salute del sistema
            icon: mdi:heart-pulse
          - type: markdown
            content: |-
              {%- set scelta = ['automation.00_nilan_cambio_stagione_automatico_t10', 'automation.00_nilan_sync',
                'automation.01_ecm_eg_estate_fascia_giorno', 'automation.01_ecm_en_estate_fascia_notturna',
                'automation.01_ecm_fc_estate', 'automation.02_ecm_safety_guard', 'automation.04_ecm_watchdog',
                'automation.04_ecm_watchdog_fc_zona', 'automation.06_ecm_humidity_override',
                'automation.07_ecm_ricambio_aria_minimo_2', 'automation.09_ecm_manuale', 'automation.10_ecm_inverno',
                'automation.99_ecm_test_nilan_write'] -%}
              {%- set tutte = states.automation | selectattr('entity_id', 'search', 'ecm|nilan|acs') | list -%}
              {#- restored = file YAML cancellato ma voce rimasta nel registro entità: non è un guasto -#}
              {%- set rimosse = tutte | selectattr('attributes.restored', 'defined') | selectattr('attributes.restored', 'eq', true) | list -%}
              {%- set aut = tutte | reject('in', rimosse) | list -%}
              {%- set guaste = aut | selectattr('state', 'in', ['unavailable', 'unknown']) | list -%}
              {%- set attive = aut | selectattr('state', 'eq', 'on') | list -%}
              {%- set spente = aut | selectattr('state', 'eq', 'off') | list -%}
              {%- set per_scelta = spente | selectattr('entity_id', 'in', scelta) | list -%}
              {%- set inattese = spente | rejectattr('entity_id', 'in', scelta) | list -%}
              {%- set ns = namespace(p=[], v=[]) -%}
              {%- for a in guaste -%}{%- set ns.p = ns.p + ['Automazione non caricata: <b>' ~ a.name ~ '</b>'] -%}{%- endfor -%}
              {%- for a in inattese -%}{%- set ns.p = ns.p + ['Automazione spenta ma di solito attiva: <b>' ~ a.name ~ '</b>'] -%}{%- endfor -%}
              {%- set b = states.sensor.nilan_batch -%}
              {%- if b is none or b.state in ['unavailable', 'unknown'] -%}
                {%- set ns.p = ns.p + ['Gateway Higeco: nessuna lettura da Nilan e Toshiba'] -%}
              {%- else -%}
                {%- set eta_b = (now() - b.last_updated).total_seconds() -%}
                {%- set tot = (b.attributes.keys() | reject('in', ['durata_s', 'friendly_name']) | list | count) -%}
                {%- if eta_b > 180 -%}{%- set ns.p = ns.p + ['Gateway Higeco: ultima lettura ' ~ (eta_b // 60) | int ~ ' min fa (di solito ogni 20 s)'] -%}
                {%- elif b.state | int(0) < tot -%}{%- set ns.v = ns.v + ['Gateway Higeco: letti ' ~ b.state ~ ' valori su ' ~ tot] -%}{%- endif -%}
              {%- endif -%}
              {%- set sonde = {'soggiorno': 'Soggiorno', 'studio': 'Studio', 'matrimoniale': 'Matrimoniale', 'ale': 'Ale', 'leo': 'Leo', 'bagno': 'Bagno'} -%}
              {%- for k, nome in sonde.items() -%}
                {%- set s = states['sensor.ble_temperature_mija_' ~ k] -%}
                {%- if s is none or s.state in ['unavailable', 'unknown'] -%}{%- set ns.p = ns.p + ['Sonda ' ~ nome ~ ': non risponde'] -%}
                {%- elif (now() - s.last_reported).total_seconds() > 900 -%}{%- set ns.v = ns.v + ['Sonda ' ~ nome ~ ': dato vecchio di ' ~ ((now() - s.last_reported).total_seconds() // 60) | int ~ ' min'] -%}{%- endif -%}
              {%- endfor -%}
              {%- set eng = states('sensor.ecm_engine_stato') -%}
              {%- if eng != 'online' -%}{%- set ns.p = ns.p + ['Motore ECM: ' ~ eng] -%}{%- endif -%}
              {%- for x in state_attr('sensor.ecm_engine_avvisi', 'elenco') or [] -%}{%- set ns.v = ns.v + ['Motore ECM: ' ~ x] -%}{%- endfor -%}
              {%- set lista = ['sensor.toshiba_on_off_unita', 'sensor.toshiba_modo_unita', 'sensor.toshiba_setpoint', 'sensor.toshiba_potenza_attiva',
                'sensor.compactp_t10_temperatura_sensore_stanza', 'sensor.compactp_t2_temperatura_immissione', 'sensor.compactp_t11_temperatura_bollitore_parte_alta',
                'sensor.compactp_t12_temperatura_bollitore_parte_bassa', 'sensor.compactp_stato_controllo', 'sensor.compactp_ventilazione_selezionata',
                'sensor.compactp_potenza_attiva', 'sensor.egwk_temp_aria_esterna_prima_egwk'] -%}
              {%- set nd = lista | select('is_state', ['unknown', 'unavailable']) | list | count -%}
              {%- if nd > 0 -%}{%- set ns.p = ns.p + [nd ~ ' sensori Nilan/Toshiba principali non disponibili (elenco sotto)'] -%}{%- endif -%}
              {%- if ns.p | count == 0 and ns.v | count == 0 %}
              <ha-alert alert-type="success">Tutto in ordine: dati aggiornati, nessun guasto.</ha-alert>
              {%- endif %}
              {%- for x in ns.p %}
              <ha-alert alert-type="error">{{ x }}</ha-alert>
              {%- endfor %}
              {%- for x in ns.v %}
              <ha-alert alert-type="warning">{{ x }}</ha-alert>
              {%- endfor %}

              **Automazioni ECM:** {{ attive | count }} attive · {{ per_scelta | count }} spente per scelta · {{ guaste | count + inattese | count }} con problemi
              {%- if rimosse | count %}

              Rimosse dalla configurazione ma ancora nel registro entità: {{ rimosse | map(attribute='name') | join(', ') }}. Si eliminano da Impostazioni → Entità.
              {%- endif %}
          - type: markdown
            title: Dati aggiornati?
            content: |-
              {%- macro eta(sec) -%}{{ 'adesso' if sec < 60 else (sec // 60) | int ~ ' min fa' if sec < 3600 else (sec // 3600) | int ~ ' h fa' }}{%- endmacro -%}
              | Fonte | Ultimo dato | Stato |
              |:--|:--|:--|
              {%- set b = states.sensor.nilan_batch %}
              {%- if b is none or b.state in ['unavailable', 'unknown'] %}
              | Gateway Higeco (Nilan, Toshiba) | — | 🔴 nessuna lettura |
              {%- else %}
              {%- set sb = (now() - b.last_updated).total_seconds() %}
              {%- set tot = b.attributes.keys() | reject('in', ['durata_s', 'friendly_name']) | list | count %}
              | Gateway Higeco (Nilan, Toshiba) | {{ eta(sb) }} | {{ '🔴 vecchio' if sb > 180 else ('🟠 ' ~ b.state ~ ' su ' ~ tot ~ ' valori' if b.state | int(0) < tot else '🟢 ' ~ b.state ~ ' su ' ~ tot ~ ' valori') }} |
              {%- endif %}
              {%- for k, nome in {'soggiorno': 'Soggiorno', 'studio': 'Studio', 'matrimoniale': 'Matrimoniale', 'ale': 'Ale', 'leo': 'Leo', 'bagno': 'Bagno'}.items() %}
              {%- set s = states['sensor.ble_temperature_mija_' ~ k] %}
              {%- if s is none or s.state in ['unavailable', 'unknown'] %}
              | Sonda {{ nome }} | — | 🔴 non risponde |
              {%- else %}
              {%- set ss = (now() - s.last_reported).total_seconds() %}
              | Sonda {{ nome }} | {{ eta(ss) }} | {{ '🟠 vecchio' if ss > 900 else '🟢 ' ~ s.state | float(0) | round(1) ~ ' °C' }} |
              {%- endif %}
              {%- endfor %}
              {%- set e = states.sensor.ecm_engine_stato %}
              {%- if e is not none %}
              | Motore ECM | solo quando cambia | {{ '🟢 online' if e.state == 'online' else '🔴 ' ~ e.state }} |
              {%- endif %}
              {%- set te = states.sensor.ecm_temperatura_esterna_affidabile %}
              {%- if te is not none %}
              | Esterna (ultima buona) | {{ eta((state_attr('sensor.ecm_temperatura_esterna_affidabile', 'eta_minuti') | int(0)) * 60) }} | ⚪ {{ te.state }} °C |
              {%- endif %}
          - type: custom:auto-entities
            show_empty: true
            card:
              type: entities
              title: Sensori Nilan / Toshiba non disponibili
              state_color: true
              show_header_toggle: false
            else:
              type: markdown
              content: "✅ Tutti i sensori Nilan e Toshiba rispondono."
            sort:
              method: name
            filter:
              template: |-
                {% set lista = [
                  'sensor.toshiba_on_off_unita', 'sensor.toshiba_modo_unita', 'sensor.toshiba_velocita_ventilatore',
                  'sensor.toshiba_setpoint', 'sensor.toshiba_velocita_compressore_u_e', 'sensor.toshiba_potenza_attiva',
                  'sensor.gestione_split_auto_mode', 'sensor.gestione_split_current_mode', 'sensor.gestione_split_dew_point',
                  'sensor.gestione_split_offset_accensione_estate', 'sensor.gestione_split_offset_accensione_inverno',
                  'sensor.gestione_split_orario_fine_spegnimento_notturno', 'sensor.gestione_split_orario_spegnimento_notturno',
                  'sensor.gestione_split_u_spec', 'sensor.egwk_temp_aria_esterna_prima_egwk',
                  'sensor.compactp_potenza_attiva', 'sensor.compactp_t2_temperatura_immissione',
                  'sensor.compactp_t4_temperatura_dopo_scambiatore_passivo', 'sensor.compactp_t5_temperatura_batteria_superiore',
                  'sensor.compactp_t6_temperatura_batteria_inferiore', 'sensor.compactp_t10_temperatura_sensore_stanza',
                  'sensor.compactp_t11_temperatura_bollitore_parte_alta', 'sensor.compactp_t12_temperatura_bollitore_parte_bassa',
                  'sensor.compactp_stato_controllo', 'sensor.compactp_ventilazione_selezionata', 'sensor.compactp_setpoint_aria',
                  'sensor.compactp_setpoint_acs_resistenza', 'sensor.compactp_setpoint_acs_compressore',
                  'sensor.compactp_offset_raffrescamento', 'sensor.compactp_temperatura_massima_bollitore',
                  'sensor.compactp_serranda_aria', 'sensor.compactp_apertura_bypass', 'sensor.compactp_chiusura_bypass',
                  'sensor.compactp_compressore', 'sensor.compactp_resistenza_elettrica_acs', 'sensor.compactp_isteresi_nz',
                  'sensor.compactp_soglia_commutazione_estate_inverno'
                ] %}
                {{ lista | select('is_state', ['unknown', 'unavailable']) | list }}

      # 2 · Motore ECM e gateway (sola lettura: niente toggle)
      - type: grid
        cards:
          - type: heading
            heading: Motore ECM e gateway
            icon: mdi:engine-outline
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.ecm_engine_stato
                name: Motore
                secondary_info: last-updated
              - entity: sensor.ecm_engine_avvisi
                name: Avvisi del motore
                icon: mdi:alert-outline
              - entity: sensor.ecm_engine_prova_in_corso
                name: Prova in corso
              - type: simple-entity
                entity: switch.ecm_engine_prove_automatiche
                name: Prove automatiche
              - entity: sensor.nilan_batch
                name: Gateway Higeco · valori letti
                icon: mdi:router-network
                secondary_info: last-updated
          - type: markdown
            content: |-
              {% set el = state_attr('sensor.ecm_engine_avvisi', 'elenco') or [] %}
              {% if el | count == 0 %}Nessun avviso dal motore.{% else %}
              {% for x in el %}
              - {{ x }}
              {% endfor %}{% endif %}
          - type: heading
            heading: Grafici
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Temperature · 12 ore
            hours_to_show: 12
            entities:
              - entity: sensor.ecm_temperatura_zona_attiva
                name: Zona
              - entity: sensor.egwk_temp_aria_esterna_prima_egwk
                name: Esterna
              - entity: sensor.compactp_t1_temperatura_aria_esterna_post_egwk
                name: Post geotermico
              - entity: sensor.compactp_t2_temperatura_immissione
                name: Immissione CP
              - entity: sensor.compactp_t10_temperatura_sensore_stanza
                name: Sonda T10
              - entity: sensor.ble_temperature_mija_garage
                name: Immissione split
          - type: history-graph
            title: Configurazione ECM · 24 ore
            hours_to_show: 24
            entities:
              - entity: sensor.ecm_configurazione_reale
                name: Reale
              - entity: input_select.stagione
                name: Stagione
              - entity: sensor.ecm_fascia_climatica_attiva
                name: Fascia


      # 3 · Automazioni ECM, per funzione. Righe senza toggle: il tocco apre solo i dettagli.
      - type: grid
        cards:
          - type: heading
            heading: Automazioni ECM
            icon: mdi:robot-outline
          - type: markdown
            content: "🟢 attiva · ⚪ spenta per scelta · 🔴 problema"
          - type: entities
            show_header_toggle: false
            entities:
              - type: section
                label: Clima estate e inverno
              - &aut
                type: custom:template-entity-row
                entity: automation.01_ecm_eg_estate_fascia_giorno
                name: EG · ECM Giorno
                state: |-
                  {%- set s = states(config.entity) -%}
                  {%- set scelta = ['automation.00_nilan_cambio_stagione_automatico_t10', 'automation.00_nilan_sync', 'automation.01_ecm_eg_estate_fascia_giorno', 'automation.01_ecm_en_estate_fascia_notturna', 'automation.01_ecm_fc_estate', 'automation.02_ecm_safety_guard', 'automation.04_ecm_watchdog', 'automation.04_ecm_watchdog_fc_zona', 'automation.06_ecm_humidity_override', 'automation.07_ecm_ricambio_aria_minimo_2', 'automation.09_ecm_manuale', 'automation.10_ecm_inverno', 'automation.99_ecm_test_nilan_write'] -%}
                  {%- if s == 'on' -%}attiva{%- elif s == 'off' and config.entity in scelta -%}spenta per scelta{%- elif s == 'off' -%}spenta: verificare{%- elif state_attr(config.entity, 'restored') -%}rimossa{%- else -%}non caricata{%- endif -%}
                color: |-
                  {%- set s = states(config.entity) -%}
                  {%- if s == 'on' -%}var(--success-color){%- elif s == 'off' and config.entity in ['automation.00_nilan_cambio_stagione_automatico_t10', 'automation.00_nilan_sync', 'automation.01_ecm_eg_estate_fascia_giorno', 'automation.01_ecm_en_estate_fascia_notturna', 'automation.01_ecm_fc_estate', 'automation.02_ecm_safety_guard', 'automation.04_ecm_watchdog', 'automation.04_ecm_watchdog_fc_zona', 'automation.06_ecm_humidity_override', 'automation.07_ecm_ricambio_aria_minimo_2', 'automation.09_ecm_manuale', 'automation.10_ecm_inverno', 'automation.99_ecm_test_nilan_write'] -%}var(--disabled-text-color){%- elif state_attr(config.entity, 'restored') -%}var(--disabled-text-color){%- else -%}var(--error-color){%- endif -%}
                secondary: |-
                  {%- set t = state_attr(config.entity, 'last_triggered') -%}
                  {%- if t -%}{%- set m = ((now() - t).total_seconds() // 60) | int -%}
                  Ultima esecuzione: {{ 'adesso' if m < 1 else m ~ ' min fa' if m < 60 else (m // 60) ~ ' h fa' if m < 1440 else (t | as_local).strftime('%d/%m %H:%M') }}
                  {%- else -%}Mai eseguita{%- endif -%}
              - {<<: *aut, entity: automation.01_ecm_en_estate_fascia_notturna, name: EN · ECM Notte}
              - {<<: *aut, entity: automation.01_ecm_fc_estate, name: FC · Free cooling}
              - {<<: *aut, entity: automation.10_ecm_inverno, name: 10 · ECM Inverno}
              - {<<: *aut, entity: automation.06_ecm_humidity_override, name: 06 · umidità lavanderia}
              - {<<: *aut, entity: automation.07_ecm_ricambio_aria_minimo_2, name: 07 · ricambio aria minimo}
              - {<<: *aut, entity: automation.00_nilan_cambio_stagione_automatico_t10, name: Cambio stagione automatico (T10)}
              - {<<: *aut, entity: automation.09_ecm_manuale, name: 09 · ECM Manuale (prove motore)}
              - type: section
                label: Protezione e supervisione
              - {<<: *aut, entity: automation.02_ecm_safety_guard, name: 02 · protezione limiti}
              - {<<: *aut, entity: automation.04_ecm_watchdog, name: 04 · supervisione}
              - {<<: *aut, entity: automation.04_ecm_watchdog_fc_zona, name: 04 · supervisione free cooling zona}
              - type: section
                label: Scrittura Nilan
              - {<<: *aut, entity: automation.nilan_write, name: 00 · Nilan WRITE (solo ACS)}
              - {<<: *aut, entity: automation.00_nilan_sync, name: 00 · Nilan SYNC}
              - type: section
                label: Acqua calda (ACS)
              - {<<: *aut, entity: automation.05_ecm_acs_manager, name: 05 · ACS Manager}
              - {<<: *aut, entity: automation.ecm_acs_prova_caldo_guardia, name: Guardia prova ACS}
              - {<<: *aut, entity: automation.ecm_acs_minimo_bollitore_basso_cp_heat_v2, name: Minimo bollitore basso · CP HEAT V2}
              - {<<: *aut, entity: automation.ecm_acs_minimo_bollitore_basso_pulizia_stato, name: Minimo bollitore basso · pulizia stato}
              - {<<: *aut, entity: automation.ecm_valutazione_riserva_acs_serale, name: Valutazione riserva serale}
              - {<<: *aut, entity: automation.ecm_memoria_target_t11_inverno_raggiunto, name: Memoria target T11 inverno}
              - {<<: *aut, entity: automation.ecm_correzione_riserva_t11_inverno, name: Correzione riserva T11 inverno}
              - {<<: *aut, entity: automation.ecm_acs_sessione_09_novembre_ore_12, name: Sessione ACS 09/11 ore 12}
              - type: section
                label: Apprendimento e campionamento
              - {<<: *aut, entity: automation.ecm_apprendimento_predittivo_orario, name: Apprendimento predittivo orario}
              - {<<: *aut, entity: automation.ecm_apprendimento_acs_serale, name: Apprendimento ACS serale}
              - {<<: *aut, entity: automation.ecm_apprendimento_acs_giornaliero_per_clima, name: Apprendimento ACS giornaliero}
              - {<<: *aut, entity: automation.ecm_acs_apprendimento_resa_sorgenti, name: Apprendimento resa sorgenti ACS}
              - {<<: *aut, entity: automation.ecm_trend_temperatura_campionamento_10m, name: Trend temperatura · 10 min}
              - {<<: *aut, entity: automation.ecm_zone_campionamento_trend_10m, name: Trend zone · 10 min}
              - {<<: *aut, entity: automation.03_ecm_diagnostica_log, name: 03 · diagnostica log}
              - {<<: *aut, entity: automation.03b_ecm_diagnostica_acs, name: 03B · diagnostica ACS}
              - type: section
                label: Test
              - {<<: *aut, entity: automation.99_ecm_test_nilan_write, name: 99 · test Nilan WRITE}

  # ───────────────────────────── APPRENDIMENTO ─────────────────────────────
  - title: Apprendimento
    path: apprendimento
    icon: mdi:school
    type: sections
    max_columns: 3
    sections:

      # ---- Adesso: prova, avvio, prove automatiche, avvisi ----
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Adesso
            icon: mdi:flask-outline
            badges:
              - type: entity
                entity: sensor.ecm_engine_stato
                show_icon: true
                show_state: true
                tap_action:
                  action: more-info

          # Avvisi del motore: compare solo se c'è qualcosa da segnalare
          - type: markdown
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: sensor.ecm_engine_avvisi
                    above: 0
                  - condition: state
                    entity: sensor.ecm_engine_stato
                    state_not:
                      - online
                      - prova in corso
            content: |-
              {%- set st = states('sensor.ecm_engine_stato') -%}
              {%- set av = state_attr('sensor.ecm_engine_avvisi','elenco') or [] -%}
              <ha-alert alert-type="warning" title="Motore: {{ 'non raggiungibile' if st in ['unknown','unavailable'] else st }}">
              {%- for a in av -%}
              {{ a }}{% if not loop.last %}<br>{% endif %}
              {%- else -%}
              {{ 'Il motore non pubblica dati: le misure sono ferme.' if st in ['unknown','unavailable'] else 'Nessun avviso.' }}
              {%- endfor -%}
              </ha-alert>

          # Prova in corso (con avanzamento) oppure prova proposta
          - type: custom:button-card
            template: ecm_base
            entity: sensor.ecm_engine_prova_in_corso
            show_icon: false
            show_name: false
            show_state: false
            grid_options:
              columns: full
            triggers_update:
              - sensor.ecm_engine_prova_in_corso
              - sensor.ecm_engine_prova_proposta
              - input_select.stagione
            custom_fields:
              prova: |
                [[[
                  const nome = (s) => {
                    let n = String(s || '');
                    const cp = n.includes('(freddo)') ? 'CP COOL'
                      : (n.includes('(caldo)') ? 'CP HEAT'
                      : (states['input_select.stagione']?.state === 'ESTATE' ? 'CP COOL' : 'CP HEAT'));
                    const map = [
                      ['Nilan ferma', 'CP OFF V0'], ['Nilan solo ventilazione', 'CP OFF'],
                      ['Nilan pompa di calore', cp], ['Toshiba spento', 'SPLIT OFF'],
                      ['Toshiba caldo bassa', 'SPLIT HEAT V1'], ['Toshiba caldo media', 'SPLIT HEAT V2'],
                      ['Toshiba caldo alta', 'SPLIT HEAT V3'], ['Toshiba freddo bassa', 'SPLIT COOL V1'],
                      ['Toshiba freddo media', 'SPLIT COOL V2'], ['Toshiba freddo alta', 'SPLIT COOL V3'],
                      ['Toshiba deumidifica bassa', 'SPLIT DRY V1'], ['Toshiba deumidifica media', 'SPLIT DRY V2'],
                      ['Toshiba deumidifica alta', 'SPLIT DRY V3'], [' (caldo)', ''], [' (freddo)', '']];
                    for (const [a, b] of map) n = n.split(a).join(b);
                    return n;
                  };
                  const off = ['nessuna', 'unknown', 'unavailable', undefined];
                  const sub = (t, c) => `<div style="font-size:13px;color:${c || 'var(--secondary-text-color)'};margin-top:4px">${t}</div>`;
                  const tit = (ic, t, c) => `<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color)"><ha-icon icon="${ic}" style="--mdc-icon-size:18px;color:${c}"></ha-icon>${t}</div>`;
                  const big = (t) => `<div style="font-size:17px;font-weight:600;color:var(--primary-text-color);margin-top:6px">${t}</div>`;
                  const nota = `<div style="font-size:12px;color:var(--secondary-text-color);margin-top:10px">Con le prove automatiche accese, le prove partono da sole tra le 10 e le 17, al massimo 3 al giorno.</div>`;
                  const ic = states['sensor.ecm_engine_prova_in_corso'];
                  const p = states['sensor.ecm_engine_prova_proposta'];
                  if (ic && !off.includes(ic.state)) {
                    const a = ic.attributes;
                    const hm = (s) => String(s || '').slice(11, 16) || '—';
                    const t0 = Date.parse(a.inizio), t1 = Date.parse(a.fine_prevista);
                    const dur = (!isNaN(t0) && !isNaN(t1) && t1 > t0) ? Math.round((t1 - t0) / 60000) : null;
                    const fatti = Number(a.minuti_trascorsi) || 0;
                    const pct = dur ? Math.max(0, Math.min(100, Math.round(fatti / dur * 100))) : 0;
                    const bar = `<div style="height:8px;border-radius:4px;background:var(--divider-color);margin-top:10px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--primary-color)"></div></div>`;
                    return tit('mdi:flask', 'Prova in corso', 'var(--primary-color)')
                      + big(nome(ic.state))
                      + bar
                      + `<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums"><span>${fatti}${dur ? ' di ' + dur : ''} minuti</span><span style="color:var(--secondary-text-color)">fine alle ${hm(a.fine_prevista)}</span></div>`
                      + sub(`Avviata ${a.origine === 'auto' ? 'in automatico' : 'a mano'} alle ${hm(a.inizio)}.`)
                      + nota;
                  }
                  if (!p || off.includes(p.state)) {
                    const m = p?.attributes?.motivo_blocco;
                    return tit('mdi:flask-empty-outline', 'Prova', 'var(--secondary-text-color)')
                      + big('Nessuna prova da fare adesso')
                      + (m ? sub(m) : '')
                      + nota;
                  }
                  const a = p.attributes;
                  const esito = a.avviabile
                    ? sub('Si può avviare adesso.', 'var(--success-color)')
                    : sub(`Non si può avviare adesso: ${a.motivo_blocco || 'motivo non indicato'}`, 'var(--warning-color)');
                  return tit('mdi:flask-outline', 'Prova proposta', a.avviabile ? 'var(--success-color)' : 'var(--warning-color)')
                    + big(nome(p.state))
                    + (a.motivo ? sub(`Perché: ${a.motivo}.`) : '')
                    + esito
                    + nota;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"prova"'
                - grid-template-columns: 1fr
              custom_fields:
                prova:
                  - justify-self: stretch
                  - text-align: left
                  - white-space: normal

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.ecm_engine_prova_avviabile
                state: "on"
              - condition: state
                entity: sensor.ecm_engine_prova_in_corso
                state: nessuna
            card:
              type: button
              entity: button.ecm_engine_avvia_prova
              name: Avvia la prova
              icon: mdi:play
              show_state: false
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.ecm_engine_avvia_prova
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.ecm_engine_prove_automatiche
                name: Prove automatiche

      # ---- In breve: per Luca ----
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: In breve
            icon: mdi:school-outline
          - type: markdown
            content: |-
              {% for r in state_attr('sensor.ecm_engine_in_breve','righe') or ['Il motore ECM non ha ancora dati.'] -%}
              - {{ r }}
              {% endfor %}
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.stagione
                state: INVERNO
            card:
              type: gauge
              entity: sensor.ecm_engine_apprendimento_caldo
              name: Misure riscaldamento
              min: 0
              max: 100
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.stagione
                state: ESTATE
            card:
              type: gauge
              entity: sensor.ecm_engine_apprendimento_freddo
              name: Misure raffrescamento
              min: 0
              max: 100
          - type: markdown
            content: Consumo e resa di ogni combinazione di Nilan e Toshiba, misurati con prove da 15 a 30 minuti. Servono a scegliere la combinazione che costa meno.
          - type: markdown
            title: Ultime prove
            content: |-
              {%- set r = state_attr('sensor.ecm_engine_ultime_prove','righe') or [] -%}
              {% if r | count == 0 -%}
              Nessuna prova fatta finora.
              {%- else -%}
              | Quando | Combinazione | Avvio | Durata | Esito |
              |---|---|---|---|---|
              {% for x in r -%}
              | {{ x.quando }} | {{ x.combinazione }} | {{ x.avvio }} | {{ x.durata }} | {{ x.esito }} |
              {% endfor %}
              {%- endif %}

      # ---- Dettaglio: dati del motore ----
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Dettaglio
            icon: mdi:table

          # Combinazioni misurate: versione corta per il telefono
          - type: markdown
            title: Combinazioni misurate
            visibility:
              - condition: screen
                media_query: "(max-width: 1023px)"
            grid_options:
              columns: full
            content: |-
              {%- set d = 'sensor.ecm_engine_dettaglio' -%}
              {%- set t = state_attr(d,'tabella') or [] -%}
              {%- macro nome_combo(s) -%}
                {%- set n = s
                  | replace('Nilan ferma', 'CP OFF V0')
                  | replace('Nilan solo ventilazione', 'CP OFF')
                  | replace('Toshiba spento', 'SPLIT OFF')
                  | replace('Toshiba caldo bassa', 'SPLIT HEAT V1')
                  | replace('Toshiba caldo media', 'SPLIT HEAT V2')
                  | replace('Toshiba caldo alta', 'SPLIT HEAT V3')
                  | replace('Toshiba freddo bassa', 'SPLIT COOL V1')
                  | replace('Toshiba freddo media', 'SPLIT COOL V2')
                  | replace('Toshiba freddo alta', 'SPLIT COOL V3')
                  | replace('Toshiba deumidifica bassa', 'SPLIT DRY V1')
                  | replace('Toshiba deumidifica media', 'SPLIT DRY V2')
                  | replace('Toshiba deumidifica alta', 'SPLIT DRY V3') -%}
                {%- if '(freddo)' in n or ('(caldo)' not in n and is_state('input_select.stagione', 'ESTATE')) -%}
                  {{- n | replace('Nilan pompa di calore', 'CP COOL') | replace(' (freddo)', '') | replace(' (caldo)', '') -}}
                {%- else -%}
                  {{- n | replace('Nilan pompa di calore', 'CP HEAT') | replace(' (caldo)', '') | replace(' (freddo)', '') -}}
                {%- endif -%}
              {%- endmacro -%}
              Temperatura esterna: **{{ state_attr(d,'fascia_esterna') or '–' }} °C**

              {% if t | count == 0 -%}
              Nessuna combinazione misurata con questa temperatura esterna.
              {%- else -%}
              | Combinazione | W | °C/h giorno · notte | W per 1 °C/h | Affid. |
              |---|---:|---:|---:|---:|
              {% for r in t -%}
              | {{ '⚠ ' if r.da_confermare else '' }}{{ nome_combo(r.descrizione) }} | {{ r.W }} | {{ r.zg }} · {{ r.zn }} | {{ r.costo if r.costo is not none else '–' }} | {{ ([r.affidabilita, 1] | min * 100) | round | int }}% |
              {% endfor %}
              ⚠ = pochi dati, valori da confermare. W per 1 °C/h: più è basso, meno costa scaldare o raffrescare. Tabella completa sullo schermo grande.
              {%- endif %}

          # Combinazioni misurate: tabella completa per schermi larghi
          - type: markdown
            title: Combinazioni misurate
            visibility:
              - condition: screen
                media_query: "(min-width: 1024px)"
            grid_options:
              columns: full
            content: |-
              {%- set d = 'sensor.ecm_engine_dettaglio' -%}
              {%- set t = state_attr(d,'tabella') or [] -%}
              Temperatura esterna: **{{ state_attr(d,'fascia_esterna') or '–' }} °C**

              {% if t | count == 0 -%}
              Nessuna combinazione misurata con questa temperatura esterna.
              {%- else -%}
              | | Combinazione | W medi | W a compressore acceso | Compressore acceso | °C/h zona giorno | °C/h zona notte | W per 1 °C/h | Periodi misurati | Affidabilità |
              |---|---|---:|---:|---:|---:|---:|---:|---:|---:|
              {% for r in t -%}
              | {{ '⚠ ' if r.da_confermare else '' }}{{ r.codice }} | {{ r.descrizione }} | {{ r.W }} | {{ r.W_cp_on if r.W_cp_on is not none else '–' }} | {{ (r.duty * 100) | round | int }}% | {{ r.zg }} | {{ r.zn }} | {{ r.costo if r.costo is not none else '–' }} | {{ r.periodi }} | {{ ([r.affidabilita, 1] | min * 100) | round | int }}% |
              {% endfor %}
              ⚠ = pochi dati, valori da confermare. W per 1 °C/h: più è basso, meno costa scaldare o raffrescare.
              {%- endif %}

          # Modalità ACS inverno: versione corta per il telefono
          - type: markdown
            title: Modalità ACS inverno
            visibility:
              - condition: screen
                media_query: "(max-width: 1023px)"
            grid_options:
              columns: full
            content: |-
              {%- set sr = 'sensor.ecm_acs_resa_sorgenti' -%}
              {%- set tab = state_attr('sensor.ecm_engine_resa_acs','tabella') or [] -%}
              {%- set acse_on = is_state('input_boolean.ecm_acs_prova_caldo_attiva','on') -%}
              {%- set acse_v = states('input_number.ecm_acs_prova_caldo_velocita') | int(0) -%}
              | Modalità | Stato | Resa (°C/h) | Campioni |
              |---|---|---:|---:|
              | **ACSr** | {{ 'attiva' if is_state('sensor.compactp_resistenza_elettrica_acs','ON') else 'ferma' }} | T11 {{ state_attr(sr,'resistenza_t11_c_h') or '–' }} · T12 {{ state_attr(sr,'resistenza_t12_c_h') or '–' }} | {{ state_attr(sr,'resistenza_campioni') or 0 }} |
              {% for v in [1, 2, 3, 4] -%}
              {%- set ns = namespace(rows=[]) -%}
              {%- for x in tab -%}
                {%- if ('CP HEAT V' ~ v ~ ' ') in x.combinazione -%}
                  {%- set ns.rows = ns.rows + [x] -%}
                {%- endif -%}
              {%- endfor -%}
              | **ACSe V{{ v }}** | {{ 'attiva' if acse_on and acse_v == v else 'ferma' }} | {{ ('T12 ' ~ (ns.rows | map(attribute='resa_bollitore_basso_c_h') | list | join(' / '))) if ns.rows | count else 'da misurare' }} | {{ ns.rows | map(attribute='finestre') | sum if ns.rows | count else 0 }} |
              {% endfor %}
              ACSr = resistenza del bollitore. ACSe Vx = CP HEAT Vx.

          # Modalità ACS inverno: tabella completa per schermi larghi
          - type: markdown
            title: Modalità ACS inverno
            visibility:
              - condition: screen
                media_query: "(min-width: 1024px)"
            grid_options:
              columns: full
            content: |-
              {%- set sr = 'sensor.ecm_acs_resa_sorgenti' -%}
              {%- set tab = state_attr('sensor.ecm_engine_resa_acs','tabella') or [] -%}
              {%- set acse_on = is_state('input_boolean.ecm_acs_prova_caldo_attiva','on') -%}
              {%- set acse_v = states('input_number.ecm_acs_prova_caldo_velocita') | int(0) -%}
              | Modalità | Azionamento | Stato | Resa osservata | Campioni |
              |---|---|---|---|---:|
              | **ACSr** | Resistenza bollitore | {{ 'attiva' if is_state('sensor.compactp_resistenza_elettrica_acs','ON') else 'ferma' }} | T11 {{ state_attr(sr,'resistenza_t11_c_h') or '–' }} °C/h · T12 {{ state_attr(sr,'resistenza_t12_c_h') or '–' }} °C/h | {{ state_attr(sr,'resistenza_campioni') or 0 }} |
              {% for v in [1, 2, 3, 4] -%}
              {%- set ns = namespace(rows=[]) -%}
              {%- for x in tab -%}
                {%- if ('CP HEAT V' ~ v ~ ' ') in x.combinazione -%}
                  {%- set ns.rows = ns.rows + [x] -%}
                {%- endif -%}
              {%- endfor -%}
              | **ACSe V{{ v }}** | CP HEAT V{{ v }} | {{ 'attiva' if acse_on and acse_v == v else 'ferma' }} | {{ (ns.rows | map(attribute='resa_bollitore_basso_c_h') | list | join(' / ') ~ ' °C/h T12') if ns.rows | count else 'da misurare' }} | {{ ns.rows | map(attribute='finestre') | sum if ns.rows | count else 0 }} |
              {% endfor %}
          - type: markdown
            title: Da misurare
            grid_options:
              columns: full
            content: |-
              {%- set d = 'sensor.ecm_engine_da_misurare' -%}
              {%- set r = state_attr(d,'righe') or [] -%}
              {%- set ora = r | selectattr('sezione','eq','Provabili adesso') | list -%}
              {%- set non_ora = r | selectattr('sezione','eq','Non provabili adesso') | list -%}
              {%- set fatte = r | selectattr('sezione','eq','Già misurate') | list -%}
              {%- macro nome_combo(s) -%}
                {%- set n = s
                  | replace('Nilan ferma', 'CP OFF V0')
                  | replace('Nilan solo ventilazione', 'CP OFF')
                  | replace('Toshiba spento', 'SPLIT OFF')
                  | replace('Toshiba caldo bassa', 'SPLIT HEAT V1')
                  | replace('Toshiba caldo media', 'SPLIT HEAT V2')
                  | replace('Toshiba caldo alta', 'SPLIT HEAT V3')
                  | replace('Toshiba freddo bassa', 'SPLIT COOL V1')
                  | replace('Toshiba freddo media', 'SPLIT COOL V2')
                  | replace('Toshiba freddo alta', 'SPLIT COOL V3')
                  | replace('Toshiba deumidifica bassa', 'SPLIT DRY V1')
                  | replace('Toshiba deumidifica media', 'SPLIT DRY V2')
                  | replace('Toshiba deumidifica alta', 'SPLIT DRY V3') -%}
                {%- if is_state('input_select.stagione', 'ESTATE') -%}
                  {{- n | replace('Nilan pompa di calore', 'CP COOL') -}}
                {%- else -%}
                  {{- n | replace('Nilan pompa di calore', 'CP HEAT') -}}
                {%- endif -%}
              {%- endmacro -%}
              Temperatura esterna: **{{ state_attr(d,'fascia_esterna') or '–' }} °C**. Ancora da misurare: **{{ states(d) }}** combinazioni.

              **Provabili adesso** ({{ ora | count }})
              {% if ora | count == 0 %}
              Con le temperature e l'orario attuali non c'è nessuna prova possibile.
              {% else %}
              | Ordine | Combinazione | Misure | Durata prova |
              |---:|---|---:|---:|
              {% for x in ora -%}
              | {{ x.ordine }} | {{ nome_combo(x.combinazione) }} | {{ x.misure }}% | {{ x.durata }} |
              {% endfor %}
              {%- endif %}

              **Non provabili adesso** ({{ non_ora | count }})
              {% if non_ora | count == 0 %}
              Nessuna.
              {% else %}
              | Combinazione | Misure | Perché |
              |---|---:|---|
              {% for x in non_ora -%}
              | {{ nome_combo(x.combinazione) }} | {{ x.misure }}% | {{ x.motivo }} |
              {% endfor %}
              {%- endif %}

              **Già misurate** ({{ fatte | count }})
              {% if fatte | count == 0 %}
              Nessuna.
              {% else %}
              | Combinazione | Misure |
              |---|---:|
              {% for x in fatte -%}
              | {{ nome_combo(x.combinazione) }} | {{ x.misure }}% |
              {% endfor %}
              {%- endif %}
          - type: markdown
            title: Avvisi e stato del motore
            content: |-
              Stato del motore: **{{ states('sensor.ecm_engine_stato') }}**

              {% for a in state_attr('sensor.ecm_engine_avvisi','elenco') or [] -%}
              - {{ a }}
              {% else -%}
              Nessun avviso.
              {%- endfor %}

