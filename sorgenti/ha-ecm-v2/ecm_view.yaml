  - type: markdown
    title: Perché ECM sta facendo questo?
    content: "{% set u_raw = states('sensor.ble_humidity_mija_lavanderia') %} {% set u = u_raw | float(0) %} {% set batt_raw = states('sensor.ble_battery_mija_lavanderia') %} {% set batt = batt_raw | float(0)\
      \ %} {% set attivo =\n  is_state('input_boolean.emc_richiesta_ventilazione_umidita', 'on') %}\n{% set v =\n  states('input_number.ecm_ventilazione_umidita_lavanderia') | int(0) %}\n{% set v_reale\
      \ =\n  states('sensor.compactp_ventilazione_selezionata') %}\n{% set minuti = ((as_timestamp(now()) -\n  as_timestamp(states.input_boolean.emc_richiesta_ventilazione_umidita.last_changed))\n  / 60)\
      \ | round(0) | int if attivo else 0 %}\n{% set tz_raw = states('sensor.ecm_temperatura_zona_attiva') %} {% set lim_raw = states('sensor.ecm_limite_inferiore') %} {% set tz = tz_raw | float(0) %} {%\
      \ set lim = lim_raw | float(0) %}\n{% if not is_number(u_raw) or not is_number(batt_raw) or batt < 10 %} ## ⚠️ Override lavanderia non disponibile Il dato non è valido: umidità **{{ u_raw }}**, batteria\
      \ sensore **{{ batt_raw }}%**.\n{% elif not attivo %} ## ✅ Gestione climatica ordinaria L'override lavanderia è **spento**. Umidità attuale: **{{ u | round(1) }}%**. Si attiva da **70%** e termina\
      \ a **65% o meno per 2 minuti**.\n{% else %} ## \U0001F4A7 Override lavanderia attivo — richiesta V{{ v }} Umidità **{{ u | round(1) }}%** · ciclo attivo da circa **{{ minuti }} minuti** · CompactP\
      \ reale **{{ v_reale }}**.\n{% if v == 4 and u >= 80 %} **Motivo:** umidità almeno all'80%, quindi viene richiesta subito V4.\n{% elif v == 4 and u >= 70 and minuti >= 40 %} **Motivo:** l'umidità\
      \ è ancora almeno al 70% dopo 40 minuti; la ventilazione è stata aumentata a V4.\n{% elif v == 3 and u >= 75 %} **Motivo:** umidità nella fascia 75–79%, quindi viene richiesta V3.\n{% elif v == 3\
      \ and u >= 70 and minuti >= 20 %} **Motivo:** l'umidità è ancora almeno al 70% dopo 20 minuti; la ventilazione è stata aumentata da V2 a V3.\n{% elif v == 2 and u < 70 %} **Motivo:** l'umidità è scesa\
      \ sotto il 70%; V2 completa il ricambio fino al termine dell'override a 65%.\n{% else %} **Motivo:** umidità nella fascia 70–74%; viene richiesta V2. {% endif %} {% endif %}\n---\n**Temperatura zona:**\
      \ {{ tz_raw }} °C · **limite inferiore:** {{ lim_raw }} °C\n{% if is_number(tz_raw) and is_number(lim_raw) and tz <= lim %} \U0001F9CA La zona è al limite o sotto: il bypass deve restare **chiuso**\
      \ per limitare il raffreddamento.\n{% else %} \U0001F321️ La zona è sopra il limite inferiore: resta valida la normale gestione termica. {% endif %}\n**Bypass apertura:** {{ states('sensor.compactp_apertura_bypass')\
      \ }} · **chiusura:** {{ states('sensor.compactp_chiusura_bypass') }}\n**Compressore CompactP:** {{ states('sensor.compactp_compressore') }} · **Toshiba:** {{ states('input_boolean.toshiba_climatizzatore')\
      \ }}\nL'override lavanderia modifica soltanto la ventilazione richiesta: non accende direttamente compressore o DRY."
