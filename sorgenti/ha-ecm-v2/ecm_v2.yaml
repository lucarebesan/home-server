            grid_options:
              columns: 4

          - type: custom:button-card
            template: ecm_title
            name: Energia
            icon: mdi:solar-power-variant
            grid_options:
              columns: full
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.growatt_inverter_growatt_pv_power_total
            name: Fotovoltaico
            icon: mdi:solar-power
            variables:
              decimals: 0
              unit: W
            grid_options:
              columns: 6
            state:
              - operator: <=
                value: 10
                color: var(--disabled-text-color)
              - operator: '>='
                value: 3000
                color: 'var(--success-color)'
              - operator: default
                color: 'var(--amber-color)'
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.growatt_inverter_growatt_total_load_power
            name: Consumo casa
            icon: mdi:home-lightning-bolt
            variables:
              decimals: 0
              unit: W
            grid_options:
              columns: 6
            state:
              - operator: <
                value: 1000
                color: 'var(--success-color)'
              - operator: <
                value: 3000
                color: 'var(--warning-color)'
              - operator: default
                color: 'var(--error-color)'
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.growatt_inverter_growatt_total_import_power
            name: Da rete
            icon: mdi:transmission-tower-import
            variables:
              decimals: 0
              unit: W
            grid_options:
              columns: 6
            state:
              - operator: <=
                value: 10
                color: 'var(--success-color)'
              - operator: <
                value: 1000
                color: 'var(--warning-color)'
              - operator: default
                color: 'var(--error-color)'
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.growatt_inverter_growatt_battery_soc
            name: Batteria
            icon: mdi:battery-charging
            grid_options:
              columns: 6
            triggers_update:
              - sensor.growatt_inverter_growatt_battery_charge_power
              - sensor.growatt_inverter_growatt_battery_discharge_power
            state_display: |
              [[[
                const soc = Number(entity?.state);
                if (isNaN(soc)) return '—';
                const ch = Number(states['sensor.growatt_inverter_growatt_battery_charge_power']?.state) || 0;
                const di = Number(states['sensor.growatt_inverter_growatt_battery_discharge_power']?.state) || 0;
                const sub = 'font-size:12px;font-weight:500;color:var(--secondary-text-color);margin-left:6px';
                if (ch > 10) return `${Math.round(soc)}%<span style="${sub}">▲ ${Math.round(ch)} W</span>`;
                if (di > 10) return `${Math.round(soc)}%<span style="${sub}">▼ ${Math.round(di)} W</span>`;
                return `${Math.round(soc)}%`;
              ]]]
            state:
              - operator: <=
                value: 20
                color: 'var(--error-color)'
              - operator: <=
                value: 50
                color: 'var(--warning-color)'
              - operator: <=
                value: 80
                color: 'var(--amber-color)'
              - operator: default
                color: 'var(--success-color)'
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.ecm_consumo_climatico_stimato
            name: Clima
            icon: mdi:hvac
            variables:
              decimals: 0
              unit: W
            grid_options:
              columns: 6
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.ecm_potenza_appresa_configurazione_reale
            name: Potenza appresa
            icon: mdi:brain
            variables:
              decimals: 0
              unit: W
            grid_options:
              columns: 6
            # Potenza appresa per livello E: serve alle logiche estive
            visibility:
              - condition: state
                entity: input_select.stagione
                state: ESTATE
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.ecm_consumo_base_casa
            name: Budget clima
            icon: mdi:calculator-variant
            grid_options:
              columns: 6
            triggers_update:
              - sensor.growatt_inverter_growatt_pv_power_total
              - sensor.ecm_potenza_appresa_configurazione_reale
            state_display: |
              [[[
                const fv = Number(states['sensor.growatt_inverter_growatt_pv_power_total']?.state);
                const base = Number(entity?.state);
                if (isNaN(fv) || isNaN(base)) return '—';
                return `${Math.round(Math.max(fv - base, 0))}<span style="font-size:12px;font-weight:500;color:var(--secondary-text-color);margin-left:2px">W</span>`;
              ]]]
            styles:
              icon:
                - color: |
                    [[[
                      const fv = Number(states['sensor.growatt_inverter_growatt_pv_power_total']?.state);
                      const base = Number(entity?.state);
                      const ap = Number(states['sensor.ecm_potenza_appresa_configurazione_reale']?.state);
                      if (isNaN(fv) || isNaN(base) || isNaN(ap)) return 'var(--disabled-text-color)';
                      const margine = Math.max(fv - base, 0) - ap;
                      if (margine >= 250) return 'var(--success-color)';
                      if (margine < -250) return 'var(--error-color)';
                      return 'var(--secondary-text-color)';
                    ]]]
          - type: custom:button-card
            template: ecm_kpi
            entity: sensor.soc_previsione_mattina
            name: SOC domattina
            icon: mdi:weather-sunset-up
            variables:
              decimals: 0
            grid_options:
              columns: 6
            state:
              - operator: <=
                value: 20
                color: 'var(--error-color)'
              - operator: <=
                value: 50
                color: 'var(--warning-color)'
              - operator: <=
                value: 80
                color: 'var(--amber-color)'
              - operator: default
                color: 'var(--success-color)'

  # ───────────────────────────── ALBERO ─────────────────────────────
  - title: Albero
    path: albero
    icon: mdi:file-tree
    type: sections
    max_columns: 3
    sections:

      # ---- Albero decisionale: cosa fa ECM e perché ----
      # Fonte della logica: automazioni nilan/* e package ecm_acs_* (vedi array RAMI nel JS).
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Albero decisionale
            icon: mdi:file-tree
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: full
            triggers_update:
              - automation.00_nilan_cambio_stagione_automatico_t10
              - automation.01_ecm_eg_estate_fascia_giorno
              - automation.01_ecm_en_estate_fascia_notturna
              - automation.01_ecm_fc_estate
              - automation.05_ecm_acs_manager
              - automation.06_ecm_humidity_override
              - automation.07_ecm_ricambio_aria_minimo_2
              - automation.09_ecm_manuale
              - automation.10_ecm_inverno
              - automation.ecm_acs_minimo_bollitore_basso_cp_heat_v2
              - automation.ecm_acs_prova_caldo_guardia
              - automation.nilan_write
              - input_boolean.ecm_acs_backup_sera_attivo
              - input_boolean.ecm_acs_ciclo_soc_attivo
              - input_boolean.ecm_acs_inverno_attesa_soc
              - input_boolean.ecm_acs_inverno_ciclo_attivo
              - input_boolean.ecm_acs_minimo_t12_attivo
              - input_boolean.ecm_acs_prova_caldo_attiva
              - input_boolean.ecm_acs_recupero_38_attivo
              - input_boolean.ecm_acs_sessione_velocita_attiva
              - input_boolean.ecm_notturna_anticipo_attivo
              - input_boolean.emc_richiesta_ventilazione_umidita
              - input_boolean.toshiba_climatizzatore
              - input_datetime.ecm_acs_backup_sera_completato
              - input_datetime.ecm_acs_prova_caldo_fine
              - input_datetime.nilan_mattina
              - input_datetime.nilan_notturna
              - input_datetime.nilan_serale
              - input_number.acs_r_set
              - input_number.acs_set
              - input_number.commutazione_estate_inverno
              - input_number.delta_freecooling
              - input_number.ecm_acs_ora_uso_appresa
              - input_number.ecm_acs_prova_caldo_velocita
              - input_number.ecm_manuale_durata_minuti
              - input_number.ecm_ventilazione_umidita_lavanderia
              - input_number.emc_ventilazione_minima_ricambio
              - input_number.isteresi
              - input_number.isteresi_commutazione_estate_inverno
              - input_number.livello_emc
              - input_number.t_estate
              - input_number.ventilatore_compactp
              - input_select.ecm_manuale
              - input_select.free_cooling
              - input_select.stagione
              - input_select.toshiba_modo
              - sensor.ble_battery_mija_lavanderia
              - sensor.ble_humidity_mija_lavanderia
              - sensor.compactp_compressore
              - sensor.compactp_isteresi_nz
              - sensor.compactp_modo_funzionale_selezionato
              - sensor.compactp_resistenza_elettrica_acs
              - sensor.compactp_setpoint_acs_compressore
              - sensor.compactp_setpoint_acs_resistenza
              - sensor.compactp_setpoint_aria
              - sensor.compactp_stato_controllo
              - sensor.compactp_t10_temperatura_sensore_stanza
              - sensor.compactp_t11_temperatura_bollitore_parte_alta
              - sensor.compactp_t12_temperatura_bollitore_parte_bassa
              - sensor.compactp_temperatura_massima_bollitore
              - sensor.compactp_ventilazione_selezionata
              - sensor.ecm_acs_target_t11_inverno
              - sensor.ecm_configurazione_reale
              - sensor.ecm_consumo_base_casa
              - sensor.ecm_fascia_climatica_attiva
              - sensor.ecm_limite_inferiore
              - sensor.ecm_limite_superiore
              - sensor.ecm_livello_descrizione
              - sensor.ecm_protezione_freddo_zona_giorno
              - sensor.ecm_protezione_freddo_zona_notte
              - sensor.ecm_target_accumulo
              - sensor.ecm_target_comfort
              - sensor.ecm_temperatura_zona_attiva
              - sensor.ecm_zona_giorno_temperatura_media
              - sensor.ecm_zona_notte_temperatura_media
              - sensor.egwk_temp_aria_esterna_prima_egwk
              - sensor.growatt_inverter_growatt_pv_power_total
              - sensor.toshiba_on_off_unita
            styles:
              card:
                - padding: 12px
                # tap_action none rende la card "disabled" (pointer-events none): servono i tocchi sui nodi
                - pointer-events: auto
                - cursor: default
              grid:
                - grid-template-areas: '"albero"'
                - grid-template-columns: 1fr
              custom_fields:
                albero:
                  - justify-self: stretch
                  - text-align: left
            custom_fields:
              albero: |
                [[[
                  // =====================================================================
                  // ALBERO DECISIONALE ECM
                  // Ogni nodo è una voce dell'array RAMI (sotto): id, domanda, entita,
                  // valore, soglia, esito, attivo. Per aggiornare l'albero quando cambia
                  // un'automazione modifica solo AUT, WRITE_ACS_ISOLATA o la voce del nodo.
                  // =====================================================================

                  // ---- Automazioni lette (entity_id reali) ----
                  const AUT = {
                    write: 'automation.nilan_write',                               // 00-NILAN WRITE
                    stagione: 'automation.00_nilan_cambio_stagione_automatico_t10', // 00-NILAN Cambio Stagione T10
                    fc: 'automation.01_ecm_fc_estate',                             // 01_ECM FreeCooling ESTATE
                    eg: 'automation.01_ecm_eg_estate_fascia_giorno',               // ECM_Giorno
                    en: 'automation.01_ecm_en_estate_fascia_notturna',             // ECM_N
                    inverno: 'automation.10_ecm_inverno',                          // 10 - ECM INVERNO
                    umidita: 'automation.06_ecm_humidity_override',                // 06-ECM HUMIDITY OVERRIDE
                    ricambio: 'automation.07_ecm_ricambio_aria_minimo_2',          // 07-ECM RICAMBIO ARIA MINIMO
                    manuale: 'automation.09_ecm_manuale',                          // 09 - ECM MANUALE
                    acs: 'automation.05_ecm_acs_manager',                          // 05-ECM ACS MANAGER
                    acs_min: 'automation.ecm_acs_minimo_bollitore_basso_cp_heat_v2', // package ecm_acs_prova_caldo
                    acs_guardia: 'automation.ecm_acs_prova_caldo_guardia',         // package ecm_acs_prova_caldo
                  };
                  // 00-NILAN WRITE dal 09/11/2026 è in "ACS isolata" (blocco iniziale che termina
                  // con stop): invia solo i setpoint ACS, setpoint aria fisso 17 °C a riposo e la
                  // ventilazione decisa dalla parte ACS. Livello E, ventilatore_compactp, t_estate e
                  // Toshiba NON partono. Metti false quando la WRITE torna completa.
                  const WRITE_ACS_ISOLATA = true;

                  // ---- Lettura stati ----
                  const st = (e) => (states[e] ? String(states[e].state) : 'unavailable');
                  const nu = (e) => { const s = st(e); return /^-?\d+(\.\d+)?$/.test(s.trim()) ? parseFloat(s) : NaN; };
                  const on = (e) => st(e) === 'on';
                  const ok = (x) => !isNaN(x);
                  const f1 = (x) => ok(x) ? (Math.round(x * 10) / 10).toLocaleString('it-IT') : '—';
                  const f2 = (x) => ok(x) ? (Math.round(x * 100) / 100).toLocaleString('it-IT') : '—';
                  const hm = (e) => st(e).slice(0, 5);
                  const autOn = (k) => on(AUT[k]);
                  const autTxt = (k) => st(AUT[k]) === 'on' ? 'ON' : (st(AUT[k]) === 'off' ? 'spenta' : 'non disponibile');
                  const minuti = (e) => states[e] ? (Date.now() - new Date(states[e].last_changed).getTime()) / 60000 : 999;
                  const VNUM = { 'OFF': 0, 'STEP 1': 1, 'STEP 2': 2, 'STEP 3': 3, 'STEP 4': 4 };

                  // ---- Contesto calcolato una volta ----
                  const c = {};
                  c.stagione = st('input_select.stagione');
                  c.estate = c.stagione === 'ESTATE';
                  c.inverno = c.stagione === 'INVERNO';
                  c.man = st('input_select.ecm_manuale');
                  c.durata = nu('input_number.ecm_manuale_durata_minuti');
                  c.fc = st('input_select.free_cooling');
                  c.fcAttivo = ['ATTIVATO', 'PREPARAZIONE'].includes(c.fc);
                  c.t10 = nu('sensor.compactp_t10_temperatura_sensore_stanza');
                  c.sInv = ok(nu('input_number.commutazione_estate_inverno')) ? nu('input_number.commutazione_estate_inverno') : 22.5;
                  c.sEst = c.sInv + (ok(nu('input_number.isteresi_commutazione_estate_inverno')) ? nu('input_number.isteresi_commutazione_estate_inverno') : 2);
                  c.fascia = st('sensor.ecm_fascia_climatica_attiva');
                  c.anticipo = on('input_boolean.ecm_notturna_anticipo_attivo');
                  c.notte = c.fascia === 'NOTTE' || c.anticipo;
                  c.gestoreK = c.notte ? 'en' : 'eg';
                  c.gestoreNome = c.notte ? 'ECM Notte' : 'ECM Giorno';
                  c.tz = nu('sensor.ecm_temperatura_zona_attiva');
                  c.tg = nu('sensor.ecm_zona_giorno_temperatura_media');
                  c.tn = nu('sensor.ecm_zona_notte_temperatura_media');
                  c.tmin = nu('sensor.ecm_limite_inferiore');
                  c.tacc = nu('sensor.ecm_target_accumulo');
                  c.tcom = nu('sensor.ecm_target_comfort');
                  c.tmax = nu('sensor.ecm_limite_superiore');
                  c.text = nu('sensor.egwk_temp_aria_esterna_prima_egwk');
                  c.dfc = ok(nu('input_number.delta_freecooling')) ? nu('input_number.delta_freecooling') : 2.5;
                  c.deltaFc = c.tz - c.text;
                  c.fcCondizioni = c.estate && c.tz > c.tmin && c.deltaFc >= c.dfc;
                  c.eReq = st('sensor.ecm_livello_descrizione');
                  c.eReqCod = c.eReq.split(' ')[0];
                  c.eReal = st('sensor.ecm_configurazione_reale');
                  c.modoNilan = st('sensor.compactp_modo_funzionale_selezionato');
                  c.cp = st('sensor.compactp_compressore');
                  c.setAria = nu('sensor.compactp_setpoint_aria');
                  c.hReale = nu('sensor.compactp_isteresi_nz');
                  c.ventReal = st('sensor.compactp_ventilazione_selezionata');
                  c.ventRealN = c.ventReal in VNUM ? VNUM[c.ventReal] : -1;
                  c.ventHelper = nu('input_number.ventilatore_compactp');
                  c.statoCtrl = st('sensor.compactp_stato_controllo');
                  c.vRic = nu('input_number.emc_ventilazione_minima_ricambio');
                  c.u = nu('sensor.ble_humidity_mija_lavanderia');
                  c.batt = nu('sensor.ble_battery_mija_lavanderia');
                  c.lavOn = on('input_boolean.emc_richiesta_ventilazione_umidita');
                  c.vLav = nu('input_number.ecm_ventilazione_umidita_lavanderia');
                  c.t11 = nu('sensor.compactp_t11_temperatura_bollitore_parte_alta');
                  c.t12 = nu('sensor.compactp_t12_temperatura_bollitore_parte_bassa');
                  c.tbMax = nu('sensor.compactp_temperatura_massima_bollitore');
                  c.acsSet = nu('input_number.acs_set');
                  c.acsSetReal = nu('sensor.compactp_setpoint_acs_compressore');
                  c.acsR = nu('input_number.acs_r_set');
                  c.acsRReal = nu('sensor.compactp_setpoint_acs_resistenza');
                  c.resOn = st('sensor.compactp_resistenza_elettrica_acs');
                  c.prova = on('input_boolean.ecm_acs_prova_caldo_attiva');
                  c.provaVel = nu('input_number.ecm_acs_prova_caldo_velocita');
                  c.protG = st('sensor.ecm_protezione_freddo_zona_giorno');
                  c.protN = st('sensor.ecm_protezione_freddo_zona_notte');
                  c.freddoEstate = c.estate && (['V2', 'V0'].includes(c.protG) || ['V2', 'V0'].includes(c.protN));
                  c.protValida = ['NORMALE', 'V2', 'V0'].includes(c.protG) && ['NORMALE', 'V2', 'V0'].includes(c.protN);
                  c.bollOk = c.t11 > 0 && c.t11 < 60 && c.t12 > 0 && c.t12 < 60 && ok(c.tbMax) && c.t11 < c.tbMax - 3;
                  // Stessa formula della WRITE (ACS isolata): set CP ACS e ventilazione inviati
                  c.cpAcsDes = c.inverno ? 20 : ((!c.bollOk || c.freddoEstate || !c.protValida || !ok(c.acsSet)) ? 25 : Math.min(Math.max(c.acsSet, 25), 50));
                  c.fanWrite = (c.inverno && c.prova && c.bollOk && [1, 2, 3, 4].includes(c.provaVel)) ? c.provaVel
                    : ((c.estate && c.bollOk && c.protValida && !c.freddoEstate && c.t12 < c.cpAcsDes) ? 1 : 0);
                  c.ariaWrite = c.prova ? (ok(c.t10) && ok(c.hReale) ? Math.min(Math.max(c.t10 + c.hReale / 2 + 0.1, 17), 30) : NaN) : 17;
                  c.ventReq = WRITE_ACS_ISOLATA ? c.fanWrite : c.ventHelper;
                  // Logica della 10 - ECM INVERNO (calcolata anche se è spenta, per dire cosa farebbe)
                  c.tzMin = Math.min(c.tg, c.tn);
                  c.tzMaxZ = Math.max(c.tg, c.tn);
                  const oraStr = new Date().toTimeString().slice(0, 8);
                  c.fasciaGiornoOra = st('input_datetime.nilan_mattina') <= oraStr && oraStr < st('input_datetime.nilan_serale');
                  c.eccedenza = (nu('sensor.growatt_inverter_growatt_pv_power_total') || 0) - (nu('sensor.ecm_consumo_base_casa') || 0);
                  c.sole = c.fasciaGiornoOra && c.eccedenza >= 1000;
                  c.obiettivo10 = c.sole ? c.tacc : c.tmin;
                  c.limiteCaldo = c.sEst - 1;
                  c.riscAttivo = on('input_boolean.toshiba_climatizzatore') && st('input_select.toshiba_modo') === 'RISCALDAMENTO';
                  c.troppoCaldo = c.tzMaxZ >= c.limiteCaldo || c.t10 >= c.limiteCaldo;
                  c.riscalda10 = !c.troppoCaldo && (c.riscAttivo ? c.tzMin < c.obiettivo10 + 0.3 : c.tzMin < c.obiettivo10);
                  c.cpParte = c.setAria - (ok(c.hReale) ? c.hReale : 0.8) / 2;
                  // ACS: modalità secondo 05-ECM ACS MANAGER e package ecm_acs_prova_caldo (ordine di priorità)
                  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
                  const prepTs = new Date(st('input_datetime.ecm_acs_backup_sera_completato').replace(' ', 'T')).getTime();
                  c.prepFatta = prepTs > oggi.getTime();
                  c.prepOra = c.prepFatta ? st('input_datetime.ecm_acs_backup_sera_completato').slice(11, 16) : '';
                  c.oraUso = nu('input_number.ecm_acs_ora_uso_appresa');
                  c.oraUsoTxt = ok(c.oraUso) ? `${Math.floor(c.oraUso)}:${String(Math.round((c.oraUso % 1) * 60)).padStart(2, '0')}` : '17:40';
                  c.provaFine = st('input_datetime.ecm_acs_prova_caldo_fine').slice(11, 16);
                  c.acsModo = (() => {
                    if (on('input_boolean.ecm_acs_sessione_velocita_attiva')) return { k: 'Sessione CP HEAT', e: 'input_boolean.ecm_acs_sessione_velocita_attiva', t: 'Sessione CP HEAT V1/V3/V4 (20 min ciascuna, split spento): resistenza a 38 °C, accumulo sospeso.', tipo: 'info' };
                    if (c.inverno && c.prova && on('input_boolean.ecm_acs_minimo_t12_attivo')) return { k: 'Minimo bollitore basso', e: 'input_boolean.ecm_acs_minimo_t12_attivo', t: `T12 era sotto 25 °C: CP in riscaldamento V${f1(c.provaVel)} per 15–20 min (fine ${c.provaFine}).`, tipo: 'info' };
                    if (c.inverno && c.prova) return { k: 'Prova CP in caldo', e: 'input_boolean.ecm_acs_prova_caldo_attiva', t: `CP in riscaldamento V${f1(c.provaVel)} fino alle ${c.provaFine}, sorvegliata dalla guardia.`, tipo: 'info' };
                    if (c.freddoEstate) return { k: 'Zona fredda', e: 'sensor.ecm_protezione_freddo_zona_giorno', t: 'Una zona è in protezione freddo: ACS solo con la resistenza, CP al minimo 25 °C.', tipo: 'info' };
                    if (c.estate && c.acsSet === 47) return { k: 'Emergenza ACS', e: 'input_number.acs_set', t: 'T11 è sceso sotto 42 °C: il CP carica il bollitore fino a 47 °C.', tipo: 'attenzione' };
                    if (c.inverno && on('input_boolean.ecm_acs_backup_sera_attivo')) return { k: 'Preparazione serale', e: 'input_boolean.ecm_acs_backup_sera_attivo', t: `Resistenza a ${f1(c.acsR)} °C per avere T11 pronto 30 min prima delle ${c.oraUsoTxt}.`, tipo: 'info' };
                    if (c.inverno && on('input_boolean.ecm_acs_recupero_38_attivo')) return { k: 'Recupero', e: 'input_boolean.ecm_acs_recupero_38_attivo', t: 'T11 è sceso sotto 38 °C: resistenza a 42 °C.', tipo: 'info' };
                    if (c.inverno && on('input_boolean.ecm_acs_inverno_ciclo_attivo')) return { k: 'Accumulo solare', e: 'input_boolean.ecm_acs_inverno_ciclo_attivo', t: `Resistenza con FV/batteria fino a T11 ${f1(nu('sensor.ecm_acs_target_t11_inverno'))} °C.`, tipo: 'info' };
                    if (c.inverno && on('input_boolean.ecm_acs_inverno_attesa_soc')) return { k: 'Attesa batteria', e: 'input_boolean.ecm_acs_inverno_attesa_soc', t: 'Accumulo fermato per calo della batteria: riparte quando recupera.', tipo: 'info' };
                    if (c.estate && (on('input_boolean.ecm_acs_ciclo_soc_attivo') || c.acsSet >= 40)) return { k: 'Carica col CP', e: 'input_number.acs_set', t: `Carica ACS col CP fino a ${f1(Math.min(c.acsSet, 50))} °C.`, tipo: 'info' };
                    if (c.inverno) return { k: 'A riposo', e: 'input_number.acs_r_set', t: `CP ACS escluso (set 20), resistenza a ${f1(c.acsR)} °C di base.${c.prepFatta ? ` Preparazione serale già fatta alle ${c.prepOra}.` : ''}`, tipo: 'ok' };
                    return { k: 'A riposo', e: 'input_number.acs_set', t: `CP ACS a ${f1(c.acsSet)} °C, resistenza ${f1(c.acsR)} °C.`, tipo: 'ok' };
                  })();
                  // Esito: confronto richiesto/reale
                  c.confronti = [
                    { n: 'Ventilazione', r: `V${f1(c.ventReq)}`, m: c.ventReal, ok: c.ventRealN === c.ventReq, valido: c.ventRealN >= 0, e: WRITE_ACS_ISOLATA ? 'input_boolean.ecm_acs_prova_caldo_attiva' : 'input_number.ventilatore_compactp' },
                    { n: 'Set CP ACS', r: f1(c.cpAcsDes), m: f1(c.acsSetReal), ok: Math.abs(c.acsSetReal - c.cpAcsDes) <= 0.05, valido: ok(c.acsSetReal), e: 'input_number.acs_set' },
                    { n: 'Resistenza', r: f1(c.acsR), m: f1(c.acsRReal), ok: Math.abs(c.acsRReal - c.acsR) <= 0.05, valido: ok(c.acsRReal) && ok(c.acsR), e: 'input_number.acs_r_set' },
                  ];
                  if (WRITE_ACS_ISOLATA && c.inverno) c.confronti.push({ n: 'Setpoint aria', r: f1(c.ariaWrite), m: f1(c.setAria), ok: c.prova ? true : Math.abs(c.setAria - 17) <= 0.05, valido: ok(c.setAria), e: 'sensor.compactp_setpoint_aria' });
                  if (!WRITE_ACS_ISOLATA && c.estate && autOn(c.gestoreK)) c.confronti.push({ n: 'Livello E', r: c.eReqCod, m: c.eReal, ok: c.eReqCod === c.eReal, valido: c.eReal !== 'NON_RICONOSCIUTA' && !['unknown', 'unavailable'].includes(c.eReal), e: 'input_number.livello_emc' });
                  c.nonValidi = c.confronti.filter(x => !x.valido);
                  c.diversi = c.confronti.filter(x => x.valido && !x.ok);
                  c.recenti = c.diversi.every(x => minuti(x.e) < 6);

                  // Banda zona: barra con le soglie ordinate e il marcatore della zona
                  const banda = (val, soglie) => {
                    const vals = soglie.filter(s => ok(s.v)).sort((a, b) => a.v - b.v);
                    if (!ok(val) || !vals.length) return '';
                    const lo = Math.min(val, ...vals.map(s => s.v)) - 0.5, hi = Math.max(val, ...vals.map(s => s.v)) + 0.5;
                    const x = (v) => ((v - lo) / (hi - lo) * 100).toFixed(1);
                    // etichette alternate sopra/sotto per non sovrapporle quando le soglie sono vicine
                    const tacche = vals.map((s, i) => `<div style="position:absolute;left:${x(s.v)}%;top:12px;height:8px;border-left:2px solid ${s.c}"></div><div style="position:absolute;left:${x(s.v)}%;top:${i % 2 ? 0 : 22}px;transform:translateX(-50%);font-size:10px;line-height:11px;color:var(--secondary-text-color);white-space:nowrap">${s.l} ${f1(s.v)}</div>`).join('');
                    return `<div style="position:relative;height:34px;margin:6px 14px 2px 14px"><div style="position:absolute;left:0;right:0;top:15px;height:2px;background:var(--divider-color)"></div>${tacche}<div style="position:absolute;left:${x(val)}%;top:10px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);background:var(--primary-color);border:2px solid var(--card-background-color)"></div></div>`;
                  };

                  // =====================================================================
                  // RAMI E NODI (dichiarativi). Campi del nodo:
                  //  id, domanda, entita (more-info al tap), valore(c), soglia(c),
                  //  esito(c) -> {tipo: ok|scelta|info|attenzione|errore, testo}, attivo(c),
                  //  righe(c) opzionale -> [{n, v, tipo}], extra(c) opzionale (HTML).
                  // Un sottoramo con quando(c) falso viene mostrato compresso in grigio.
                  // =====================================================================
                  const RAMI = [
                    {
                      id: 'comandi', titolo: 'Chi comanda', icona: 'mdi:transit-connection-variant',
                      nodi: [
                        {
                          id: 'write', domanda: 'WRITE attiva?', entita: AUT.write,
                          valore: () => autTxt('write'),
                          soglia: () => 'Unica automazione che scrive su Nilan e Toshiba',
                          esito: () => !autOn('write')
                            ? { tipo: 'errore', testo: 'No: nessun comando arriva alle macchine. Il Nilan decide da solo.' }
                            : { tipo: 'ok', testo: 'Sì: verifica e scrive ogni 5 min e a ogni cambio di impostazione.' },
                          attivo: () => true,
                        },
                        {
                          // Non leggibile da stati: la WRITE termina sempre con uno stop senza condizione
                          // ("Modalita temporanea ACS isolata"). Segue la costante WRITE_ACS_ISOLATA.
                          id: 'writeIsolata', domanda: 'WRITE in modalità ACS isolata?', entita: 'sensor.compactp_setpoint_aria',
                          valore: () => WRITE_ACS_ISOLATA ? 'SÌ' : 'NO',
                          soglia: () => `setpoint aria reale ${f1(c.setAria)} °C · Set estate ${f1(nu('input_number.t_estate'))} · Isteresi CP ${f1(nu('input_number.isteresi'))} (reale ${f1(c.hReale)})`,
                          esito: () => WRITE_ACS_ISOLATA
                            ? { tipo: 'scelta', testo: `Sì (scelta del 09/11): arrivano solo i setpoint ACS, la ventilazione della parte ACS e il setpoint aria fisso a 17 °C${c.prova ? ' (durante la prova CP in caldo: T10 + isteresi/2)' : ''}. Livello E, ventilazione ECM, Set estate, Isteresi CP e Toshiba non vengono inviati.` }
                            : { tipo: 'ok', testo: 'No: la WRITE invia tutte le impostazioni ECM.' },
                          attivo: () => autOn('write'),
                        },
                        {
                          id: 'manuale', domanda: 'Gestione manuale?', entita: 'input_select.ecm_manuale',
                          valore: () => c.man.split(' - ')[0],
                          soglia: () => `AUTO = decidono le automazioni · durata manuale ${f1(c.durata)} min`,
                          esito: () => {
                            if (c.man === 'AUTO') return { tipo: 'ok', testo: 'No, AUTO.' };
                            if (!autOn('manuale')) return { tipo: 'scelta', testo: `Selezionato «${c.man}», ma ECM Manuale è spenta per scelta: la selezione non viene applicata.` };
                            if (c.man === 'FREE COOLING') return { tipo: 'info', testo: 'Free cooling chiesto a mano: lo gestisce l\'automazione Free cooling (solo in estate).' };
                            return { tipo: 'attenzione', testo: `Manuale ${c.man}: torna AUTO dopo ${f1(c.durata)} min.${WRITE_ACS_ISOLATA ? ' Con la WRITE isolata il comando non arriva alle macchine.' : ''}` };
                          },
                          attivo: () => true,
                        },
                      ],
                    },
                    {
                      id: 'stagione', titolo: 'Stagione', icona: 'mdi:sun-snowflake-variant',
                      nodi: [
                        {
                          id: 'stagione', domanda: 'Che stagione è?', entita: 'input_select.stagione',
                          valore: () => c.stagione,
                          soglia: () => `T10 ${f1(c.t10)} °C · INVERNO sotto ${f1(c.sInv)} · ESTATE sopra ${f1(c.sEst)}`,
                          esito: () => {
                            const dovrebbe = c.t10 < c.sInv ? 'INVERNO' : (c.t10 > c.sEst ? 'ESTATE' : c.stagione);
                            if (!ok(c.t10)) return { tipo: 'errore', testo: 'T10 non valida: la stagione non può cambiare da sola.' };
                            if (!autOn('stagione')) return { tipo: 'scelta', testo: `Cambio automatico da T10 spento per scelta: resta ${c.stagione} finché non la cambi a mano.${dovrebbe !== c.stagione ? ` Con il cambio attivo passerebbe a ${dovrebbe}.` : ''}` };
                            return { tipo: 'ok', testo: c.inverno ? `INVERNO: torna ESTATE sopra ${f1(c.sEst)} °C.` : `ESTATE: passa a INVERNO sotto ${f1(c.sInv)} °C.` };
                          },
                          attivo: () => true,
                        },
                      ],
                    },
                    {
                      id: 'clima', titolo: 'Clima', icona: 'mdi:thermostat',
                      sottorami: [
                        {
                          id: 'estate', titolo: 'Estate', quando: () => c.estate, perche: () => `stagione ${c.stagione}`,
                          nodi: [
                            {
                              id: 'fc', domanda: 'Free cooling?', entita: 'input_select.free_cooling',
                              valore: () => c.fc,
                              soglia: () => `zona ${f1(c.tz)} − esterna ${f1(c.text)} = ${f1(c.deltaFc)} °C (serve ≥ ${f1(c.dfc)}) e zona sopra il minimo ${f1(c.tmin)}`,
                              esito: () => {
                                if (c.fcAttivo) return { tipo: 'info', testo: `Free cooling ${c.fc}: aria esterna, CP spento. Decide l'automazione Free cooling.` };
                                if (!autOn('fc')) return { tipo: 'scelta', testo: 'Automazione Free cooling spenta per scelta: nessun free cooling automatico.' };
                                return c.fcCondizioni ? { tipo: 'info', testo: 'Condizioni presenti: può partire al prossimo controllo (ogni minuto).' } : { tipo: 'ok', testo: 'No: l\'aria esterna non è abbastanza fresca.' };
                              },
                              attivo: () => c.estate,
                            },
                            {
                              id: 'fascia', domanda: 'Fascia oraria', entita: 'sensor.ecm_fascia_climatica_attiva',
                              valore: () => c.anticipo ? 'NOTTE (anticipo)' : c.fascia,
                              soglia: () => `giorno ${hm('input_datetime.nilan_mattina')}–${hm('input_datetime.nilan_serale')} · notte da 1 h prima delle ${hm('input_datetime.nilan_notturna')}`,
                              esito: () => ({ tipo: 'info', testo: `Decide ${c.gestoreNome}${c.anticipo ? ' (anticipo dalle 18 per la batteria)' : ''}.` }),
                              attivo: () => c.estate && !c.fcAttivo,
                            },
                            {
                              id: 'gestore', domanda: 'Automazione della fascia attiva?', entita: AUT.eg,
                              entitaFn: () => AUT[c.gestoreK],
                              valore: () => `${c.gestoreNome} ${autTxt(c.gestoreK)}`,
                              soglia: () => c.notte ? 'ECM Notte: livello E da temperatura, umidità e SOC previsto' : 'ECM Giorno: livello E da temperatura zona, trend e SOC, ogni 5 min (cambi ogni 15)',
                              esito: () => autOn(c.gestoreK)
                                ? { tipo: 'ok', testo: `${c.gestoreNome} decide il livello E.` }
                                : { tipo: 'scelta', testo: `${c.gestoreNome} spenta per scelta: nessuno decide il livello E.` },
                              attivo: () => c.estate && !c.fcAttivo,
                            },
                            {
                              id: 'banda', domanda: `Temperatura zona ${c.notte ? 'notte' : 'giorno'}`, entita: 'sensor.ecm_temperatura_zona_attiva',
                              valore: () => `${f2(c.tz)} °C`,
                              soglia: () => `min ${f1(c.tmin)} · accumulo ${f1(c.tacc)} · comfort ${f1(c.tcom)} · max ${f1(c.tmax)}`,
                              extra: () => banda(c.tz, [{ v: c.tmin, l: 'min', c: 'var(--info-color)' }, { v: c.tacc, l: 'acc', c: 'var(--primary-color)' }, { v: c.tcom, l: 'comf', c: 'var(--success-color)' }, { v: c.tmax, l: 'max', c: 'var(--error-color)' }]),
                              esito: () => {
                                if (!ok(c.tz)) return { tipo: 'errore', testo: 'Temperatura zona non valida.' };
                                if (c.tz <= c.tmin) return { tipo: 'info', testo: 'Sotto il minimo: niente raffrescamento.' };
                                if (c.tz <= c.tacc) return { tipo: 'ok', testo: 'Accumulo raggiunto.' };
                                if (c.tz <= c.tcom) return { tipo: 'ok', testo: 'In zona di accumulo.' };
                                if (c.tz < c.tmax - 0.5) return { tipo: 'attenzione', testo: 'Sopra il comfort.' };
                                if (c.tz < c.tmax) return { tipo: 'attenzione', testo: 'A meno di 0,5 °C dal massimo.' };
                                return { tipo: 'errore', testo: 'Sopra il massimo: emergenza.' };
                              },
                              attivo: () => c.estate && !c.fcAttivo && autOn(c.gestoreK),
                            },
                            {
                              id: 'livello', domanda: 'Livello E richiesto e reale', entita: 'input_number.livello_emc',
                              valore: () => `${c.eReqCod} → ${c.eReal}`,
                              soglia: () => c.eReq,
                              esito: () => {
                                if (WRITE_ACS_ISOLATA) return { tipo: 'scelta', testo: 'Il livello non viene inviato: WRITE in ACS isolata.' };
                                if (c.eReal === 'NON_RICONOSCIUTA') return { tipo: 'errore', testo: 'Configurazione reale non riconosciuta.' };
                                return c.eReqCod === c.eReal ? { tipo: 'ok', testo: 'Allineato.' } : { tipo: 'attenzione', testo: 'Diverso: il Nilan non ha ancora applicato il comando.' };
                              },
                              attivo: () => c.estate && !c.fcAttivo && autOn(c.gestoreK),
                            },
                          ],
                        },
                        {
                          id: 'inverno', titolo: 'Inverno', quando: () => c.inverno, perche: () => `stagione ${c.stagione}`,
                          nodi: [
                            {
                              id: 'inverno10', domanda: 'ECM Inverno attiva?', entita: AUT.inverno,
                              valore: () => autTxt('inverno'),
                              soglia: () => `zona più fredda ${f2(c.tzMin)} °C · obiettivo ${f1(c.obiettivo10)} °C (${c.sole ? 'accumulo, FV in eccedenza' : 'limite inferiore'}) · stop da ${f1(c.limiteCaldo)} °C`,
                              esito: () => {
                                const farebbe = c.riscalda10 ? 'scalderebbe (zona sotto l\'obiettivo)' : 'non scalderebbe';
                                if (!autOn('inverno')) return { tipo: 'scelta', testo: `Spenta per scelta: nessuna logica ECM sul clima. Se fosse attiva ${farebbe}.` };
                                const w = WRITE_ACS_ISOLATA ? ' Con la WRITE isolata Toshiba e Set estate non vengono inviati.' : '';
                                return c.riscalda10 ? { tipo: 'info', testo: `Riscalda: Toshiba in riscaldamento e CP almeno V${c.fasciaGiornoOra ? 3 : 2}.${w}` } : { tipo: 'ok', testo: `Non serve riscaldare.${w}` };
                              },
                              attivo: () => c.inverno,
                            },
                            {
                              id: 'nilan', domanda: 'Cosa fa il Nilan da solo?', entita: 'sensor.compactp_setpoint_aria',
                              valore: () => `set ${f1(c.setAria)} °C`,
                              soglia: () => `${c.modoNilan.toLowerCase()} · CP parte se T10 < set − isteresi/2 = ${f1(c.cpParte)} °C · T10 ${f1(c.t10)} °C · CP ${c.cp}`,
                              esito: () => {
                                if (!ok(c.setAria) || !ok(c.t10)) return { tipo: 'errore', testo: 'Setpoint o T10 non validi.' };
                                const vent = c.ventReal === 'OFF' ? ' Ventilazione ferma: il CP non lavora.' : '';
                                return c.t10 < c.cpParte ? { tipo: 'info', testo: `T10 sotto la soglia: il Nilan scalda.${vent}` } : { tipo: 'ok', testo: `T10 sopra la soglia: niente riscaldamento.${vent}` };
                              },
                              attivo: () => c.inverno,
                            },
                            {
                              id: 'toshiba', domanda: 'Split Toshiba', entita: 'sensor.toshiba_on_off_unita',
                              valore: () => st('sensor.toshiba_on_off_unita'),
                              soglia: () => `richiesto: ${st('input_boolean.toshiba_climatizzatore')} · ${st('input_select.toshiba_modo').toLowerCase()}`,
                              esito: () => autOn('inverno') ? { tipo: 'info', testo: 'Lo comanda ECM Inverno.' } : { tipo: 'info', testo: 'Nessuna automazione lo comanda ora.' },
                              attivo: () => c.inverno,
                            },
                          ],
                        },
                      ],
                    },
                    {
                      id: 'ventilazione', titolo: 'Ventilazione', icona: 'mdi:fan',
                      nodi: [
                        {
                          id: 'vent', domanda: 'Velocità richiesta e reale', entita: 'sensor.compactp_ventilazione_selezionata',
                          valore: () => `V${f1(c.ventReq)} → ${c.ventReal}`,
                          soglia: () => WRITE_ACS_ISOLATA
                            ? `Decide la WRITE (parte ACS): ventilazione solo con prova CP in caldo (inverno) o carica ACS (estate). Ventilazione ECM V${f1(c.ventHelper)} non inviata · ${c.statoCtrl.toLowerCase()}`
                            : `Massimo tra clima, ricambio, lavanderia e ACS · ${c.statoCtrl.toLowerCase()}`,
                          esito: () => !autOn('write') ? { tipo: 'errore', testo: 'WRITE spenta: la velocità la decide il Nilan.' }
                            : c.ventRealN < 0 ? { tipo: 'errore', testo: 'Velocità reale non valida.' }
                            : (c.ventRealN === c.ventReq ? { tipo: 'ok', testo: 'Allineata.' } : { tipo: 'attenzione', testo: 'Diversa: la WRITE riallinea entro 5 min.' }),
                          attivo: () => true,
                        },
                        {
                          id: 'contributi', domanda: 'Chi chiede aria?', entita: AUT.ricambio,
                          valore: () => '',
                          soglia: () => WRITE_ACS_ISOLATA ? 'Con la WRITE isolata solo la riga ACS arriva alla macchina' : 'Vince la richiesta più alta',
                          righe: () => [
                            (() => {
                              if (c.estate) {
                                if (c.fcAttivo) return { n: 'Clima · Free cooling', v: `${c.fc}`, tipo: 'info' };
                                return autOn(c.gestoreK) ? { n: `Clima · ${c.gestoreNome}`, v: 'ON', tipo: 'ok' } : { n: `Clima · ${c.gestoreNome}`, v: 'spenta per scelta', tipo: 'scelta' };
                              }
                              return autOn('inverno') ? { n: 'Clima · ECM Inverno', v: c.riscalda10 ? `V${c.fasciaGiornoOra ? 3 : 2}` : 'nessuna', tipo: 'ok' } : { n: 'Clima · ECM Inverno', v: 'spenta per scelta', tipo: 'scelta' };
                            })(),
                            autOn('ricambio') ? { n: 'Ricambio · 07', v: c.vRic > 0 ? `V${f1(c.vRic)}` : 'nessuna', tipo: 'ok' } : { n: 'Ricambio · 07', v: `spenta per scelta · ultimo V${f1(c.vRic)}`, tipo: 'scelta' },
                            (() => {
                              const u = `${f1(c.u)}%`;
                              if (!ok(c.u) || !ok(c.batt) || c.batt < 10) return { n: 'Lavanderia · 06', v: `sensore non valido (${u}, batteria ${f1(c.batt)}%)`, tipo: 'errore' };
                              if (!autOn('umidita')) return { n: 'Lavanderia · 06', v: `spenta per scelta · ${u}, partirebbe sopra 75%`, tipo: 'scelta' };
                              return c.lavOn ? { n: 'Lavanderia · 06', v: `V${f1(c.vLav)} · ${u}`, tipo: 'info' } : { n: 'Lavanderia · 06', v: `nessuna · ${u}`, tipo: 'ok' };
                            })(),
                            c.fanWrite > 0 ? { n: 'ACS · WRITE', v: `V${f1(c.fanWrite)}${c.prova ? ' (CP in caldo)' : ' (carica ACS)'}`, tipo: 'info' } : { n: 'ACS · WRITE', v: 'nessuna', tipo: 'ok' },
                          ],
                          esito: () => null,
                          attivo: () => true,
                        },
                      ],
                    },
                    {
                      id: 'acs', titolo: 'Acqua calda', icona: 'mdi:water-boiler',
                      nodi: [
                        {
                          id: 'acs05', domanda: 'ACS Manager attiva?', entita: AUT.acs,
                          valore: () => autTxt('acs'),
                          soglia: () => `T11 ${f1(c.t11)} °C · T12 ${f1(c.t12)} °C · max bollitore ${f1(c.tbMax)} °C`,
                          esito: () => autOn('acs') ? { tipo: 'ok', testo: 'Sì: decide set CP ACS e resistenza.' } : { tipo: 'attenzione', testo: 'Spenta: nessuno decide l\'ACS.' },
                          attivo: () => true,
                        },
                        {
                          id: 'acsModo', domanda: 'Cosa sta facendo?', entita: c.acsModo.e,
                          valore: () => c.acsModo.k,
                          soglia: () => `set CP ${f1(c.acsSet)} (reale ${f1(c.acsSetReal)}) · resistenza ${f1(c.acsR)} (reale ${f1(c.acsRReal)}, ${c.resOn.toLowerCase()})`,
                          esito: () => ({ tipo: c.acsModo.tipo, testo: c.acsModo.t }),
                          attivo: () => autOn('acs') || c.prova,
                        },
                        {
                          id: 'acsSoglie', domanda: 'Cosa farebbe scattare un intervento?', entita: 'sensor.compactp_t12_temperatura_bollitore_parte_bassa',
                          valore: () => '',
                          soglia: () => '',
                          righe: () => c.inverno ? [
                            { n: 'Minimo bollitore basso', v: `T12 sotto 25 °C (ora ${f1(c.t12)}) · automazione ${autTxt('acs_min')}`, tipo: c.t12 < 25 ? 'attenzione' : 'ok' },
                            { n: 'Recupero', v: `T11 sotto 38 °C (ora ${f1(c.t11)})`, tipo: c.t11 < 38 ? 'attenzione' : 'ok' },
                            { n: 'Preparazione serale', v: c.prepFatta ? `fatta alle ${c.prepOra}` : `pronta entro le ${c.oraUsoTxt} − 30 min`, tipo: c.prepFatta ? 'ok' : 'info' },
                          ] : [
                            { n: 'Emergenza', v: `T11 sotto 42 °C (ora ${f1(c.t11)})`, tipo: c.t11 <= 42 ? 'attenzione' : 'ok' },
                            { n: 'Zona fredda', v: `giorno ${c.protG} · notte ${c.protN}`, tipo: c.freddoEstate ? 'attenzione' : 'ok' },
                          ],
                          esito: () => null,
                          attivo: () => autOn('acs'),
                        },
                      ],
                    },
                    {
                      id: 'esito', titolo: 'Esito', icona: 'mdi:check-decagram-outline',
                      nodi: [
                        {
                          id: 'allineato', domanda: 'Le macchine fanno quello che ECM chiede?', entita: AUT.write,
                          valore: () => '',
                          soglia: () => 'richiesto → reale',
                          righe: () => c.confronti.map(x => ({ n: x.n, v: `${x.r} → ${x.m}`, tipo: !x.valido ? 'errore' : (x.ok ? 'ok' : 'attenzione') })),
                          esito: () => {
                            if (!autOn('write')) return { tipo: 'errore', testo: 'WRITE spenta: nessun riallineamento.' };
                            if (c.nonValidi.length) return { tipo: 'errore', testo: `Dato non valido: ${c.nonValidi.map(x => x.n.toLowerCase()).join(', ')}.` };
                            if (!c.diversi.length) return { tipo: 'ok', testo: 'Allineato.' };
                            if (c.recenti) return { tipo: 'attenzione', testo: `In transizione: ${c.diversi.map(x => x.n.toLowerCase()).join(', ')} (la WRITE riallinea entro 5 min).` };
                            return { tipo: 'errore', testo: `Non allineato: ${c.diversi.map(x => x.n.toLowerCase()).join(', ')}.` };
                          },
                          attivo: () => true,
                        },
                      ],
                    },
                  ];

                  // =====================================================================
                  // DISEGNO
                  // =====================================================================
                  const COL = { ok: 'var(--success-color)', scelta: 'var(--info-color)', info: 'var(--primary-color)', attenzione: 'var(--warning-color)', errore: 'var(--error-color)' };
                  const ICO = { ok: 'mdi:check-circle-outline', scelta: 'mdi:pause-circle-outline', info: 'mdi:arrow-right-circle-outline', attenzione: 'mdi:alert-outline', errore: 'mdi:close-octagon-outline' };
                  const GRIGIO = 'var(--disabled-text-color, #9e9e9e)';
                  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                  // Icone con larghezza fissa: button-card dà a ha-icon una larghezza in %, che sballa i flex.
                  const ico = (i, px, col, extra = '') => `<ha-icon icon="${i}" style="--mdc-icon-size:${px}px;width:${px}px;height:${px}px;flex:none;margin:0;color:${col};${extra}"></ha-icon>`;
                  const conn = (attivo) => `<div style="margin-left:14px;height:8px;border-left:2px ${attivo ? 'solid var(--primary-color)' : `dashed ${GRIGIO}`}"></div>`;
                  // Etichette brevi per il riepilogo del percorso (id nodo → etichetta). Nodi assenti = non nel riepilogo.
                  const BREVE = { write: 'WRITE', writeIsolata: 'ACS isolata', manuale: 'Gestione', stagione: 'Stagione', fc: 'Free cooling', fascia: 'Fascia', gestore: 'Logica', banda: 'Zona', livello: 'Livello', inverno10: 'ECM Inverno', nilan: 'Nilan', toshiba: 'Split', vent: 'Ventilazione', acsModo: 'ACS', allineato: 'Esito' };

                  // Valuta ogni nodo una volta sola.
                  const valuta = (n) => {
                    const attivo = n.attivo(c);
                    const es = n.esito(c);
                    const tipo = es ? es.tipo : 'info';
                    return { n, attivo, es, tipo, col: attivo ? COL[tipo] : GRIGIO, val: n.valore(c), so: n.soglia(c), righe: n.righe ? n.righe(c) : [], extra: n.extra ? n.extra(c) : '' };
                  };

                  // Nodo chiudibile: riga con domanda e valore; la spiegazione si apre toccando.
                  // Aperto di default solo se c'è qualcosa da guardare (attenzione/errore).
                  const nodoHtml = (v) => {
                    const { n, attivo, es, tipo, col, val, so, righe, extra } = v;
                    // Lo stato aperto/chiuso sopravvive ai ridisegni della card (salvato in window per id nodo).
                    const memo = window.__ecmAlberoAperti || {};
                    const aperto = n.id in memo ? memo[n.id] : (attivo && (tipo === 'attenzione' || tipo === 'errore'));
                    const righeHtml = righe.map(r => `<div style="display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid var(--divider-color)">${ico(ICO[r.tipo], 14, attivo ? COL[r.tipo] : GRIGIO)}<span style="flex:1;color:var(--primary-text-color)">${esc(r.n)}</span><span style="text-align:right;color:var(--secondary-text-color)">${esc(r.v)}</span></div>`).join('');
                    return `<details ${aperto ? 'open' : ''} style="opacity:${attivo ? 1 : 0.55};border:1px ${attivo ? 'solid' : 'dashed'} var(--divider-color);border-left:4px solid ${col};border-radius:10px;background:var(--card-background-color)">
                      <summary onclick="event.preventDefault();event.stopPropagation();const d=this.parentElement;d.open=!d.open;(window.__ecmAlberoAperti=window.__ecmAlberoAperti||{})['${n.id}']=d.open;" style="list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;padding:8px 10px">
                        ${ico(attivo ? ICO[tipo] : 'mdi:minus-circle-outline', 18, col)}
                        <span style="flex:1;font-size:13.5px;font-weight:600;color:var(--primary-text-color)">${esc(n.domanda)}</span>
                        ${val ? `<span style="font-size:14px;font-weight:700;color:${col};text-align:right">${esc(val)}</span>` : ''}
                        ${ico('mdi:chevron-down', 18, 'var(--secondary-text-color)')}
                      </summary>
                      <div style="padding:0 10px 10px 36px">
                        ${so ? `<div style="font-size:12px;color:var(--secondary-text-color)">${esc(so)}</div>` : ''}
                        ${extra}
                        ${righeHtml ? `<div style="font-size:12px;margin-top:6px">${righeHtml}</div>` : ''}
                        ${es ? `<div style="margin-top:6px;font-size:13px;color:${attivo ? 'var(--primary-text-color)' : GRIGIO}">${esc(es.testo)}</div>` : ''}
                      </div>
                    </details>`;
                  };
                  const catena = (vs) => vs.map((v, i) => (i ? conn(v.attivo) : '') + nodoHtml(v)).join('');
                  const compresso = (sr) => `<div style="opacity:.55;border:1px dashed var(--divider-color);border-left:4px solid ${GRIGIO};border-radius:10px;padding:6px 10px;font-size:12px;color:${GRIGIO}"><b>${esc(sr.titolo)}</b>: non attivo (${esc(sr.perche(c))}) · ${sr.nodi.map(n => esc(n.domanda)).join(' → ')}</div>`;

                  // Valutazione di tutti i rami (serve sia al riepilogo sia al dettaglio).
                  const VAL = RAMI.map(r => {
                    if (r.sottorami) {
                      const attivi = r.sottorami.filter(sr => sr.quando(c)).map(sr => ({ sr, vs: sr.nodi.map(valuta) }));
                      const spenti = r.sottorami.filter(sr => !sr.quando(c));
                      return { r, attivi, spenti, vs: attivi.flatMap(a => a.vs) };
                    }
                    return { r, vs: r.nodi.map(valuta) };
                  });

                  // Riepilogo del percorso: un'etichetta per ogni nodo attivo con etichetta breve.
                  const chip = (v) => {
                    const t = BREVE[v.n.id];
                    const testo = v.val || (v.es ? v.es.testo.replace(/\.$/, '') : '');
                    return `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:color-mix(in srgb, ${v.col} 16%, transparent);font-size:12px;line-height:1.3"><span style="color:var(--secondary-text-color)">${esc(t)}</span><b style="color:${v.col}">${esc(testo)}</b></span>`;
                  };
                  const freccia = `<span style="color:var(--secondary-text-color);font-size:12px">›</span>`;
                  const percorso = VAL.flatMap(x => x.vs).filter(v => v.attivo && BREVE[v.n.id]).map(chip).join(freccia);
                  const problemi = VAL.flatMap(x => x.vs).filter(v => v.attivo && (v.tipo === 'attenzione' || v.tipo === 'errore'));
                  const testata = `<div style="margin-bottom:12px">
                    <div style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--secondary-text-color);margin-bottom:6px">Percorso attuale</div>
                    <div style="display:flex;flex-wrap:wrap;gap:4px 4px;align-items:center">${percorso}</div>
                    <div style="margin-top:8px;font-size:12.5px;color:${problemi.length ? 'var(--warning-color)' : 'var(--secondary-text-color)'}">${problemi.length ? `Da guardare: ${problemi.map(v => esc(v.n.domanda)).join(' · ')} (aperti qui sotto).` : 'Niente da segnalare. Tocca un passaggio per vedere perché.'}</div>
                  </div>`;

                  const ramoHtml = (x) => {
                    const { r } = x;
                    const corpo = r.sottorami
                      ? x.attivi.map(a => `<div style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--primary-color);margin:2px 0 4px 2px">${esc(a.sr.titolo)}</div>${catena(a.vs)}`).join('')
                        + x.spenti.map(sr => `<div style="margin-top:6px">${compresso(sr)}</div>`).join('')
                      : catena(x.vs);
                    return `<div style="margin-bottom:4px"><div style="display:flex;align-items:center;gap:8px;margin:6px 0 6px 2px">${ico(r.icona, 20, 'var(--primary-color)')}<span style="font-size:15px;font-weight:700;color:var(--primary-text-color)">${esc(r.titolo)}</span></div>${corpo}</div>`;
                  };

                  return `<div style="display:flex;flex-direction:column;text-align:left;white-space:normal;line-height:1.35">${testata}${VAL.map((x, i) => (i ? conn(true) : '') + ramoHtml(x)).join('')}
                    <div style="margin-top:10px;font-size:11px;color:var(--secondary-text-color);display:flex;flex-wrap:wrap;gap:4px 10px"><span><span style="color:var(--info-color)">■</span> spenta per scelta</span><span><span style="color:var(--success-color)">■</span> ok</span><span><span style="color:var(--warning-color)">■</span> attenzione</span><span><span style="color:var(--error-color)">■</span> problema</span><span>grigio = non in uso</span></div></div>`;
                ]]]

      # ---- Ultime decisioni ----
      - type: grid
        cards:
          - type: heading
            heading: Ultime decisioni
            icon: mdi:history
          - type: logbook
            hours_to_show: 12
            grid_options:
              columns: full
            entities:
              - sensor.ecm_configurazione_reale
              - input_number.livello_emc
              - input_select.stagione
              - input_select.ecm_manuale
              - input_select.free_cooling
              - input_number.acs_set
              - input_number.acs_r_set
              - input_boolean.ecm_acs_prova_caldo_attiva

  # ───────────────────────────── IMPOSTAZIONI ─────────────────────────────
  - title: Impostazioni
    path: impostazioni
    icon: mdi:tune-vertical
    type: sections
    max_columns: 3
    sections:

      # ── Uso quotidiano: gestione e temperature
      - type: grid
        cards:
          - type: heading
            heading: Gestione
            icon: mdi:gamepad-variant-outline
          - type: custom:mushroom-select-card
            entity: input_select.ecm_manuale
            name: Gestione ECM
            icon: mdi:hand-back-right
            icon_color: blue
            grid_options:
              columns: full
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              {%- set durata = states('input_number.ecm_manuale_durata_minuti') | int(20) -%}
              {%- if is_state('automation.09_ecm_manuale', 'off') -%}
              <ha-alert alert-type="info">ECM Manuale spenta per scelta: la selezione qui non viene applicata.</ha-alert>
              {% endif -%}
              AUTO: decidono le automazioni ECM. Una combinazione E… avvia una prova a tempo ({{ durata }} min), poi torna AUTO. La usa anche il motore ECM per le sue prove.

          - type: heading
            heading: Stagione
            heading_style: subtitle
            icon: mdi:sun-snowflake-variant
          - type: custom:button-card
            template: ecm_stagione
            name: Estate
            icon: mdi:white-balance-sunny
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.stagione
              data:
                option: ESTATE
              confirmation:
                text: |-
                  [[[
                    const a = states['automation.00_nilan_cambio_stagione_automatico_t10'];
                    if (a && a.state === 'on') return 'Passare a ESTATE? Di solito la stagione cambia da sola in base a T10.';
                    return 'Passare a ESTATE? Il cambio automatico da T10 è spento: la stagione resta questa finché non la cambi di nuovo.';
                  ]]]
            state:
              - value: ESTATE
                color: var(--warning-color)
                styles:
                  card:
                    - background: color-mix(in srgb, var(--warning-color) 14%, transparent)
                  name:
                    - color: var(--warning-color)
          - type: custom:button-card
            template: ecm_stagione
            name: Inverno
            icon: mdi:snowflake
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.stagione
              data:
                option: INVERNO
              confirmation:
                text: |-
                  [[[
                    const a = states['automation.00_nilan_cambio_stagione_automatico_t10'];
                    if (a && a.state === 'on') return 'Passare a INVERNO? Di solito la stagione cambia da sola in base a T10.';
                    return 'Passare a INVERNO? Il cambio automatico da T10 è spento: la stagione resta questa finché non la cambi di nuovo.';
                  ]]]
            state:
              - value: INVERNO
                color: var(--info-color)
                styles:
                  card:
                    - background: color-mix(in srgb, var(--info-color) 14%, transparent)
                  name:
                    - color: var(--info-color)
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              {%- set s = states('input_number.commutazione_estate_inverno') | float(22.5) -%}
              {%- set i = states('input_number.isteresi_commutazione_estate_inverno') | float(2) -%}
              {%- if is_state('automation.00_nilan_cambio_stagione_automatico_t10', 'on') -%}
              Cambia da sola con T10: inverno sotto {{ '%.1f' | format(s) | replace('.', ',') }} °C, estate sopra {{ '%.1f' | format(s + i) | replace('.', ',') }} °C.
              {%- else -%}
              <ha-alert alert-type="info">Cambio automatico da T10 spento per scelta: la stagione resta quella scelta qui.</ha-alert>
              {%- endif %}

          - type: heading
            heading: Temperature
            icon: mdi:thermometer-lines
          - type: custom:mushroom-number-card
            entity: input_number.t_inverno
            name: Set inverno
            icon: mdi:snowflake-thermometer
            icon_color: blue
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.t_estate
            name: Set estate
            icon: mdi:sun-thermometer
            icon_color: orange
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.t_min_inverno
            name: Min inverno
            icon: mdi:thermometer-chevron-down
            icon_color: blue
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.t_max_estate
            name: Max estate
            icon: mdi:thermometer-chevron-up
            icon_color: orange
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.delta_confort
            name: Δ comfort
            icon: mdi:delta
            icon_color: amber
            display_mode: buttons
            grid_options:
              columns: 6
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              {%- if is_state('input_select.stagione', 'ESTATE') -%}
              Estate: Max estate è il limite superiore; comfort, accumulo e limite inferiore stanno sotto di coefficiente × Δ comfort. Set estate è il setpoint aria del CP (meno l'offset di raffrescamento); Set inverno lo allinea ECM da solo.
              {%- else -%}
              Inverno: comfort, accumulo e limite superiore = Set inverno + coefficiente × Δ comfort. Min inverno è il limite inferiore. Set estate è il setpoint aria del CP.
              {%- endif %}

      # ── Uso quotidiano: acqua calda, orari, free cooling
      - type: grid
        cards:
          - type: heading
            heading: Acqua calda
            icon: mdi:water-boiler
          - type: custom:mushroom-number-card
            entity: input_number.acs_set
            name: Set ACS
            icon: mdi:thermometer-water
            icon_color: red
            display_mode: buttons
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.acs_r_set
            name: Set resistenza
            icon: mdi:heating-coil
            icon_color: deep-orange
            display_mode: buttons
            grid_options:
              columns: 6
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              Set ACS: acqua calda con il CP. Set resistenza: acqua calda con la resistenza del bollitore.
              {%- if is_state('input_select.stagione', 'INVERNO') %} In inverno scalda la resistenza; il CP resta escluso.{% endif %}
              {%- if is_state('automation.05_ecm_acs_manager', 'on') %} Li regola ACS Manager ogni minuto: un valore messo a mano può essere cambiato subito.{% endif %}

          - type: heading
            heading: Orari
            icon: mdi:clock-outline
          - type: custom:time-picker-card
            entity: input_datetime.nilan_mattina
            name: Mattina
            hour_mode: 24
            hour_step: 1
            minute_step: 5
            link_values: true
            hide:
              seconds: true
              icon: true
            layout:
              hour_mode: double
              align_controls: center
              name: header
              embedded: false
              thin: true
            grid_options:
              columns: 6
          - type: custom:time-picker-card
            entity: input_datetime.nilan_serale
            name: Sera
            hour_mode: 24
            hour_step: 1
            minute_step: 5
            link_values: true
            hide:
              seconds: true
              icon: true
            layout:
              hour_mode: double
              align_controls: center
              name: header
              embedded: false
              thin: true
            grid_options:
              columns: 6
          - type: custom:time-picker-card
            entity: input_datetime.nilan_notturna
            name: Notte
            hour_mode: 24
            hour_step: 1
            minute_step: 5
            link_values: true
            hide:
              seconds: true
              icon: true
            layout:
              hour_mode: double
              align_controls: center
              name: header
              embedded: false
              thin: true
            grid_options:
              columns: 6
          - type: custom:time-picker-card
            entity: input_datetime.doccia_time
            name: Doccia
            hour_mode: 24
            hour_step: 1
            minute_step: 5
            link_values: true
            hide:
              seconds: true
              icon: true
            layout:
              hour_mode: double
              align_controls: center
              name: header
              embedded: false
              thin: true
            grid_options:
              columns: 6
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              Giorno: da Mattina a Sera, per ECM e per il motore ECM. Zona notte: da un'ora prima di Notte fino a Mattina. Doccia: la usano le luci del lavello in lavanderia, non ECM.

          - type: heading
            heading: Free cooling
            icon: mdi:weather-windy
          - type: custom:mushroom-select-card
            entity: input_select.free_cooling
            name: Free cooling
            icon: mdi:weather-windy
            icon_color: teal
            grid_options:
              columns: 6
          - type: custom:mushroom-number-card
            entity: input_number.delta_freecooling
            name: Δ free cooling
            icon: mdi:delta
            icon_color: teal
            display_mode: buttons
            grid_options:
              columns: 6
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |-
              {%- set d = states('input_number.delta_freecooling') | float(2.5) -%}
              {%- if is_state('automation.01_ecm_fc_estate', 'off') -%}
              <ha-alert alert-type="info">Automazione Free cooling spenta per scelta: qui non cambia nulla.</ha-alert>
              {% endif -%}
              Solo in estate. Lo stato lo aggiorna l'automazione; ATTIVATO a mano chiede l'avvio. Parte se in casa fa almeno {{ '%.1f' | format(d) | replace('.', ',') }} °C più che fuori, si ferma sotto {{ '%.1f' | format([d - 1, 0.5] | max) | replace('.', ',') }} °C.

      # ── Avanzate: parametri tecnici
      - type: grid
        cards:
          - type: heading
            heading: Avanzate
            icon: mdi:cog-outline
          - type: markdown
