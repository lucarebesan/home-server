user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name ha.lrhub.duckdns.org;

        ssl_certificate /etc/ssl/private/live/lrhub.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/live/lrhub.duckdns.org/privkey.pem;
        ssl_trusted_certificate /etc/ssl/private/live/lrhub.duckdns.org/chain.pem;

        location / {
            proxy_pass http://192.168.1.100:8123;
            proxy_set_header Host $host;
            proxy_redirect http:// https://;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name cloud.lrhub.duckdns.org;

        add_header Strict-Transport-Security "max-age=15552000" always;

        ssl_certificate /etc/ssl/private/live/lrhub.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/live/lrhub.duckdns.org/privkey.pem;
        ssl_trusted_certificate /etc/ssl/private/live/lrhub.duckdns.org/chain.pem;

        client_max_body_size 10G;

        location = /.well-known/carddav {
            return 301 /remote.php/dav;
        }

        location = /.well-known/caldav {
            return 301 /remote.php/dav;
        }

        location / {
            proxy_pass http://nextcloud-app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
